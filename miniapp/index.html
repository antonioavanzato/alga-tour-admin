{id:'w_m10',req:['october'],k:['weather','climate','rain','hot','cold','warm','temperature','water','sea','season','good time','worth','sunny','swim','wind','waves','how is the weather','what is the weather','weather like','weather in','best time','best season','when to go','when to visit','when should i go','when is the best','high season','low season','which month','what season','raining','rainy','showers','monsoon','thunderstorm','cloudy','umbrella','forecast','app shows rain','weather app','app says rain','water temperature','water warm','warm water','is the water','sea temperature','cold water','wetsuit','can i swim','degrees','is it hot','hot there','how hot','is it cold','cold at night','chilly','jacket','sweater','windy','rough sea','calm sea','storm','what to pack','what to bring','what should i bring','what clothes','what to wear in the maldives','sunscreen','spf','strong sun','sun protection','get a tan','tan'],a:'☀️ Maldives weather in October:\n• daytime — about +30 °C\n• evening and night — about +26 °C\n• water — +28 °C\n\nThe sea gradually calms down, sunny, short rains.\n\nIf it rains, it’s short — about an hour, then sunshine again. Excursions run all year.',go:'exc',gl:'Excursions'},
{id:'w_m11',req:['november'],k:['weather','climate','rain','hot','cold','warm','temperature','water','sea','season','good time','worth','sunny','swim','wind','waves','how is the weather','what is the weather','weather like','weather in','best time','best season','when to go','when to visit','when should i go','when is the best','high season','low season','which month','what season','raining','rainy','showers','monsoon','thunderstorm','cloudy','umbrella','forecast','app shows rain','weather app','app says rain','water temperature','water warm','warm water','is the water','sea temperature','cold water','wetsuit','can i swim','degrees','is it hot','hot there','how hot','is it cold','cold at night','chilly','jacket','sweater','windy','rough sea','calm sea','storm','what to pack','what to bring','what should i bring','what clothes','what to wear in the maldives','sunscreen','spf','strong sun','sun protection','get a tan','tan'],a:'☀️ Maldives weather in November:\n• daytime — about +30 °C\n• evening and night — about +26 °C\n• water — +28 °C\n\nTransition to the dry season: more and more sun, calmer sea.\n\nIf it rains, it’s short — about an hour, then sunshine again. Excursions run all year.',go:'exc',gl:'Excursions'},
{id:'w_m12',req:['december'],k:['weather','climate','rain','hot','cold','warm','temperature','water','sea','season','good time','worth','sunny','swim','wind','waves','how is the weather','what is the weather','weather like','weather in','best time','best season','when to go','when to visit','when should i go','when is the best','high season','low season','which month','what season','raining','rainy','showers','monsoon','thunderstorm','cloudy','umbrella','forecast','app shows rain','weather app','app says rain','water temperature','water warm','warm water','is the water','sea temperature','cold water','wetsuit','can i swim','degrees','is it hot','hot there','how hot','is it cold','cold at night','chilly','jacket','sweater','windy','rough sea','calm sea','storm','what to pack','what to bring','what should i bring','what clothes','what to wear in the maldives','sunscreen','spf','strong sun','sun protection','get a tan','tan'],a:'☀️ Maldives weather in December:\n• daytime — about +30 °C\n• evening and night — about +26 °C\n• water — +28 °C\n\nStart of the dry season: sunny, calm sea. New Year is peak demand — book as early as possible.\n\nIf it rains, it’s short — about an hour, then sunshine again. Excursions run all year.',go:'exc',gl:'Excursions'},
{id:'bot',k:['are you a bot','are you a robot','are you human','are you real','are you ai','who am i talking to','what can you do','how can you help','real person','a real person','are you a person','human'],a:'I’m the ALGA assistant in this app 🙂 I quickly answer common questions: excursions and prices, resorts, hotels, the signature tour, diving, weather, payment and cancellation.\nIf your question is complex or personal, a real manager will reply in about 15 minutes.',go:'mgr',gl:'Message a manager'},
{id:'dates',k:['date','dates','when is the tour','next tour','upcoming','available','schedule','which month','in january','in february','in march','in april','in november','in december','in may','tour dates','signature tour dates'],a:'Upcoming signature tour dates: 01.11–08.11, 30.12–06.01 (New Year), 24.01–31.01, 13.02–20.02, 06.03–13.03, 20.03–27.03, 03.04–10.04, 28.04–05.05.\nExcursions run almost every day — choose the date in your request.',go:'tour',gl:'Choose dates'},
 {id:'dive',k:['dive','diving','scuba','open water','advanced','padi','certificate','shark tank','go diving','want to go diving','i want to dive'],a:'Diving with an instructor — from $55:\n• Discover Scuba Diving — first dive for beginners, 2–3 hours\n• Shark Tank Dive — dive with sharks, for experienced divers\n• Single Dive — for certified divers (tanks, weights, guide, transfer included)\n• Open Water Diver — international certificate, down to 18 m, 3–4 days\n• Advanced Open Water — down to 30 m, 2–3 days\nPhotos and videos included.',go:'dive',gl:'Diving'},
 {id:'active',k:['parasail','jet ski','jetski','jet car','flyboard','surf','banana','kayak','sup','paddle','wakeboard','water ski','water sports','water activities','activities'],a:'Water activities on Maafushi: parasailing, jet skis and Jet Car, flyboard, wakeboarding and water skiing, banana and Fun Tube, kayaks and SUP, surfing, combo packages for two. We work with trusted local operators. Prices depend on season and weather — ask a manager.',go:'mgr',gl:'Ask for prices'},
 {id:'photo',k:['photoshoot','photo shoot','photographer','photo session','shooting','portfolio'],a:'Photoshoots in the Maldives:\n• At a resort — from $250: 2 hours (resort entry and photographer transfer extra)\n• On an uninhabited island or sandbank — from $200: 1.5 hours (transfer from $100)\n• Drone — +$100, drone only — $150\nAll originals the same day on your drive (32 GB+), 10 retouched and 30 color-graded photos within 2 weeks after you choose them.',go:'mgr',gl:'Book a shoot'},
 {id:'wed',k:['wedding','ceremony','bride','groom','engagement','marry','marriage','vow','proposal','propose','getting married','get married'],a:'Wedding ceremony on a local or uninhabited island — from $700:\n• photographer for 2 hours: all originals, 10 retouched, 30 color-graded photos\n• arch decoration, ceremony and certificate\n• bridal bouquet (rental, artificial flowers)\nThe ceremony is held in English by a Maldivian in national dress. Makeup and hair — extra (from Malé, from $150), video — from $150.',go:'mgr',gl:'Discuss a wedding'},
 {id:'terms',k:['booking terms','booking conditions','booking policy','terms','conditions','policy','agreement','cancellation and refund rules'],a:'ALGA excursion booking terms:\n\n💳 Payment\n• Prepayment — $10 per person per excursion: non-refundable, included in the price. Paid in RUB at the USD rate (Rosselkhozbank, purchase).\n• Balance: RUB card transfer (resorts — cash USD only), cash USD, or VISA / MasterCard / UnionPay at the office — 4% Bank of Maldives fee.\n• Full payment — no later than 2 days before the excursion, otherwise the booking may be considered cancelled by the client.\n\n🔁 Rescheduling — once, no later than 5 days before, subject to group and free spots.\n\n❌ Cancellation\n• You cancel 24+ hours before — refund minus prepayment; less than 24 hours — no refund.\n• The company cancels — 100% refund within 1 business day.\n• Excursions are group-based: the date depends on group formation and weather, so the company may change it.\n\n🤒 Illness — refund or rescheduling only with medical documents (one per participant). Sunburn and women’s critical days are not valid reasons.\n\n🕔 Office — daily 17:00–22:00, outside these hours message a manager.\n\nBy booking with ALGA TOURS, you agree to the booking and cancellation policy.',go:'mgr',gl:'Message a manager'},
{id:'full',k:['full payment','pay in full','pay the full','pay the rest','remaining amount','balance due','when do i pay the','how many days before pay'],a:'Full payment for an excursion is due no later than 2 days before the date. If it is not made, the company may consider the booking cancelled by the client.\nMethods: RUB card transfer (resorts — cash USD only), cash USD, or card at the office (4% fee).'},
{id:'ill',k:['ill','illness','sick','fever','medical','doctor','hospital','food poisoning','unwell','sunburn','sunburnt','period','critical days','medical certificate','medical document','if i get sick'],a:'If you get ill:\nIf you learn about an illness 24 hours before the excursion and decide to cancel, to request a refund or rescheduling you need to:\n1. Notify an ALGA manager in writing (messenger).\n2. Provide medical documents confirming contraindications for the excursion date — available at the hospital on Maafushi Island.\n3. A separate document is required for each participant.\n⚠️ Without medical documents the booking is considered cancelled with no refund or rescheduling.\n\n❗ Not valid reasons for a refund or rescheduling:\n• sunburn\n• women’s critical days\nGuests are responsible for considering the risks of the country of stay.',go:'mgr',gl:'Message a manager'},
{id:'datechg',k:['changed the date','change the excursion date','can you reschedule','why was it moved','group not formed','group-based','group based','not enough people','cancelled because of weather','because of weather','bad weather','due to weather'],a:'ALGA excursions are group-based: the date depends on group formation and weather. So the company reserves the right to change the excursion date if necessary.\nIf the company cancels — 100% refund within 1 business day.'},
{id:'hours',k:['office hours','opening hours','working hours','what time is the office','when is the office open','open until','open from'],a:'The ALGA office on Maafushi is open daily 17:00–22:00. Outside these hours message a manager on WhatsApp or Telegram — we are available 24/7.\nExcursion photos and videos can be picked up at the office the same day, 19:00–22:00.'},
{id:'prepay',k:['deposit','prepay','prepayment','advance payment','how to book','how do i book','booking','reserve'],a:'Deposit:\n• excursions — $10 per person per excursion (non-refundable, part of the price)\n• hotels — 20% of the total, 2000 RUB of it non-refundable\nThe deposit is paid in rubles at the USD rate (Rosselkhozbank). Excursions must be fully paid at least 2 days before, otherwise the booking may be cancelled.',go:'form',gl:'Send a request'},
 {id:'pay',k:['pay','payment','card','cash','dollar','usd','ruble','rub ','transfer','commission','fee','visa card','mastercard','unionpay'],a:'Paying the balance:\n• in rubles by bank transfer (except resorts — USD cash only)\n• USD cash at the office\n• VISA / MasterCard / UnionPay at the office, if your card works abroad — 4% Bank of Maldives fee\nThe deposit is paid in rubles at the USD rate (Rosselkhozbank).'},
 {id:'cancel',k:['cancel','cancellation','refund','money back','can t come','cannot come','weather is bad','bad weather','storm','changed our mind','change our mind','changed my mind','cancel booking','cancel my','cancel the'],a:'Excursion cancellation:\n• if you cancel 24+ hours before — refund minus the deposit\n• less than 24 hours before — no refund\n• if we cancel (e.g. due to weather) — 100% refund within 1 business day'},
 {id:'move',k:['reschedule','postpone','change the date','another date','move the date','change the day','another day','different day','move my','move the'],a:'An excursion can be moved to another date once — no later than 5 days before it, subject to group and availability.'},
 {id:'imuga',k:['imuga','declaration','arrival form','what form','fill in a form','qr code'],a:'Before flying to the Maldives every traveller (kids too) fills in the Traveller Declaration — IMUGA:\n• only on the official site imuga.immigration.gov.mv — it is free\n• no earlier than 96 hours (4 days) before arrival\n• you get a QR code — show it at immigration\n⚠️ Fake sites charge money for this — do not pay.\nFor tours and trips — message the ALGA manager.',go:'mgr',gl:'Message the manager'},
{id:'customs',k:['customs','bring alcohol','can i bring','duty free','prohibited items','pork','not allowed to bring','prohibited to bring','prohibited','what is prohibited','not allowed'],a:'You cannot bring into the Maldives (Maldives Customs):\n• alcohol — even from duty free, it will be confiscated\n• pork and pork products\n• vapes and e-cigarettes — confiscated\n• drugs, pornography, idols for worship, weapons\nAlcohol is available at resorts — on our Adaaran, Centara and Sun Siyam day trips drinks are included.',go:'res',gl:'Resorts'},
{id:'smoke',k:['smok','cigarette','tobacco','vape','vaping','e-cig','iqos','nicotine'],a:'Smoking in the Maldives:\n• since 1 November 2025 anyone born on or after 1 January 2007 may not buy or use tobacco — tourists included\n• vapes and e-cigarettes are banned for everyone — import, sale and use\nSource: Maldives law and WHO.',go:'mgr',gl:'Message the manager'},
{id:'loc_rules',k:['local rules','island rules','dress code','what to wear','bikini','swimsuit','muslim','alcohol on maafushi','drink on the island','where to drink','wear a bikini','bikini on maafushi','wear a swimsuit'],a:'Maafushi is a local island with its own rules:\n• swimsuits and bikinis — only on the designated bikini beach\n• in the village cover shoulders and knees\n• no alcohol is sold on local islands\nWant to sunbathe anywhere with a cocktail? Join our resort day trip: Adaaran and Centara — unlimited drinks, Sun Siyam — drinks 10:00–16:30.',go:'res',gl:'Resorts'},
{id:'green_tax',k:['green tax','tourist tax','tax per night','bed tax'],a:'Green Tax is charged per night by your accommodation:\n• guesthouses and hotels up to 50 rooms on local islands (like Maafushi) — $6 per person per night\n• resorts and larger hotels — $12 per person per night\n• children under 2 — free\nSource: Maldives tax authority (MIRA).',go:'mgr',gl:'Message the manager'},
{id:'dep_tax',k:['departure tax','airport tax','exit fee','departure fee'],a:'Maldives departure charge for foreigners: economy $50, business $120, first $240 (since 1 December 2024). It is usually already included in your air ticket. Children under 2 and transit under 24 hours are exempt.',go:'mgr',gl:'Message the manager'},
{id:'get_maaf',k:['get to maafushi','from the airport','from airport','ferry','speedboat','speed boat','airport transfer','from the airport to maafushi','airport to maafushi','ferry to maafushi','is there a ferry'],a:'From Velana airport to Maafushi:\n• speedboat — about 30–45 minutes, the easiest option\n• public ferry — cheaper but slower, no service on Fridays\nSchedules and prices change — check before travel. The ALGA manager can help with transfer and hotel.',go:'mgr',gl:'Message the manager'},
{id:'sim',k:['sim card','sim','esim','mobile data','internet in the maldives','roaming','dhiraagu','ooredoo'],a:'Mobile connection in the Maldives:\n• two operators — Dhiraagu and Ooredoo, both with good 4G\n• buy a tourist SIM right in the arrivals area of Velana airport — passport required\n• eSIM is available too\nOn our resort day trips there is Wi-Fi (unlimited at Centara).',go:'res',gl:'Resorts'},
{id:'ws_rules',k:['touch the whale shark','whale shark rules','how close','distance from the shark','flash','south ari','whale sharks all year','year round whale'],a:'Whale sharks live in South Ari all year round — one of the few such places in the world. Encounter rules (Maldives Whale Shark Research Programme):\n• do not touch the shark\n• keep 3–4 metres away\n• do not block its path or splash\n• no flash\n• always listen to the guide\nWhale shark snorkelling with ALGA — $110, kids 3–10 — $70.',go:'exc',gl:'Trips'},
{id:'x_ride_whale',k:['how far is the whale shark','how long is the boat ride','how long to get to the whale','boat ride to the whale','how far is south ari','travel time to the whale'],a:'Whale sharks live in South Ari — according to operators, about 1.5–2 hours by speedboat each way from Maafushi (depends on where the shark is found that day).\nSo it is a full-day trip: meet 7:00 at Maafushi jetty, depart 7:30 → whale shark → manta lagoon → Picnic island (lunch, water, towels) → back around 15:00.\nPrice — $110, kids 3–10 — $70.',go:'exc',gl:'Trips'},
{id:'ws_guar',k:['guaranteed','guarantee','will we definitely see','what if we don t see','if we don t see','chance to see','what are the chances'],a:'Whale sharks stay in South Ari all year round — one of the few such places in the world. But they are wild animals in the open ocean, so nobody can guarantee an encounter.\nAsk the ALGA manager before booking what happens if the shark is not found on your day.',go:'mgr',gl:'Message the manager'},
{id:'seasick',k:['seasick','motion sickness','sea sickness','nausea','get sick on the boat'],a:'If you get seasick:\n• take a motion-sickness remedy about an hour before departure (ask a pharmacy or doctor which one)\n• look at the horizon on the boat\nThe sea is calmest from December to April. The shortest trip is Half Day ($35); the longest is the whale shark (about 1.5–2 hours each way).',go:'exc',gl:'Trips'},
{id:'x_lunch',k:['lunch on the trip','is lunch included','food on the trip','is there food','towels on the trip','vegetarian','vegan','allergy'],a:'All our sea trips include lunch on an island, water and beach towels. On the Aquarium trip there are also sun umbrellas on the sandbank.\nIf you need vegetarian food or have an allergy — tell the manager in advance.',go:'exc',gl:'Trips'},
{id:'x_bring',k:['what to bring on the trip','what should i bring on the excursion','what to take on the trip','what to wear on the trip'],a:'We provide SCUBA PRO gear (mask, snorkel, fins, life jacket), water, lunch and a towel. Underwater photos and video on GoPro 12/13 are included too.\nBring a swimsuit, sunscreen and a hat — the sun in the Maldives is very strong.',go:'exc',gl:'Trips'},
{id:'x_meet',k:['meeting point','where do we meet','where do we depart','what time do we meet','hotel pickup','pick us up from the hotel','pick up from hotel'],a:'We meet at Maafushi jetty and pick gear there:\n• Whale shark — meet 7:00, depart 7:30, back 15:00\n• Sharks, sandbank, dolphins and rays — meet 7:45, depart 8:00, back 14:30\n• Aquarium — meet 9:00, depart 9:15, back 15:00\nThe manager will confirm the exact time for your date.',go:'exc',gl:'Trips'},
{id:'x_gopro',k:['gopro','underwater photos','who takes photos','phone in the water','waterproof case'],a:'We take underwater photos and video on GoPro 12/13 — included in the trip. Pick them up at our Maafushi office the same day 19:00–22:00.\nDrone filming at the sharks and the sandbank — $20 per person per location.',go:'exc',gl:'Trips'},
{id:'x_shade',k:['shade on the sandbank','is there shade','umbrella'],a:'On the Aquarium trip we set up sun umbrellas on the sandbank. On other trips bring a hat and sunscreen — the sun is strong.',go:'exc',gl:'Trips'},
{id:'x_two',k:['two trips in one day','2 trips a day','two excursions in one day','how many trips in a week','how many excursions in a week'],a:'Our sea trips run in the first half of the day and overlap (departures 7:30–9:15, back 14:30–15:00), so usually it is one trip per day. The manager will help plan your dates.',go:'mgr',gl:'Message the manager'},
{id:'atm',k:['atm','cash machine','withdraw cash','withdraw money','exchange money','currency exchange','bank on maafushi'],a:'Maafushi has ATMs: Bank of Maldives (a USD ATM since 2024) and MIB (USD and rufiyaa). Handy, because resort day trips are paid in USD cash only.',go:'mgr',gl:'Message the manager'},
{id:'doctor',k:['doctor','hospital','clinic','pharmacy','medical','health centre','health center'],a:'Maafushi has a health centre (Maafushi Health Centre, Ministry of Health). Serious cases are taken to Malé — about 30–45 minutes by boat. Travel medical insurance is strongly recommended.',go:'mgr',gl:'Message the manager'},
{id:'float_bar',k:['floating bar','bar on a boat','where to drink','buy alcohol','party','nightlife'],a:'No alcohol is sold on Maafushi itself — it is a local island. Floating bars (converted yachts) are anchored a few minutes offshore; hotels usually arrange the boat.\nFor a full day with unlimited drinks, beach and pool — a resort day trip: Adaaran and Centara — unlimited, Sun Siyam — drinks 10:00–16:30.',go:'res',gl:'Resorts'},
{id:'fishing',k:['fishing','go fishing','night fishing','catch fish'],a:'We organise fishing. Ask the ALGA manager about the programme, time and price. Fishing is paid in USD cash only.',go:'mgr',gl:'Message the manager'},
{id:'res_other',k:['spa at the resort','massage at the resort','kayak at the resort','bring my own food','leave early','come back earlier','change the resort','rain at the resort','kids club','kids area'],a:'A resort day includes only what is listed for each resort (lunch, drinks, sunbeds, towels, transfer — each resort differs; ask "what is included at Adaaran" etc.).\nSpa, water sports, changing the resort or returning early are not in the description — message the manager, they will check with the resort.',go:'mgr',gl:'Message the manager'},
{id:'visa',k:['visa','passport','entry','how long can i stay','how many days can i stay','stay as a tourist','as a tourist','extend','90 days','30 days','immigration','border'],a:'Russian citizens do not need a visa: a free 30-day entry permit is stamped on arrival; it can be extended up to 90 days in total (at the discretion of Maldives Immigration). Many other nationalities also get a free 30-day visa on arrival — please check the rules for your passport.'},
 {id:'contact',k:['contact','whatsapp','telegram','call','phone','write to','message you','manager','katya','ekaterina','reply','respond','reach you','get in touch'],a:'We are available 24/7 on WhatsApp and Telegram, average response time is about 15 minutes. Or send a request right in the app.',go:'mgr',gl:'Message on Telegram'},
 {id:'about',k:['who are you','about you','about the company','agency','alga','founder','experience','reliable','trust'],a:'ALGA is a travel agency in the Maldives. Founder Ekaterina has lived in the Maldives for over 10 years, creates signature tours, organizes excursions and personally looks after guests. Direct contracts with hotels, no middlemen, 24/7 support.'},
 {id:'why',k:['why you','why alga','why book with','cheaper','best price','discount','booking.com','choose you','better than booking','why should'],a:'Why ALGA: direct contracts with hotels without middlemen, best price guarantee and access to villas not listed on Booking. Available 24/7.'},
 {id:'island',k:['maafushi','local island','where are you','where is your','office','location','find you','pier','jetty'],a:'We are based on Maafushi island — excursions and resort trips start from the Maafushi pier, and our office is there too (photos from excursions, cash or card payments).'},
 {id:'pg_what',k:['what are presets','what is a preset','what s a preset','why presets','what do presets do','what are presets for','what presets are'],a:'What is a preset — in simple words:\nA preset is a saved set of photo editing settings for Lightroom: light, colour, contrast, tones. Tap a preset and your photo gets a signature colour in one tap, like a photographer’s.\n\nA LUT is the same for video: a colour table for DaVinci, Premiere, VN.\n\nWhy use them:\n• save time — no need to move dozens of sliders\n• all trip photos get one consistent style\n• a pro result without retouching skills\n\nMaldives Presets by Anton Avanzato — 5 presets + 5 LUTs, made for turquoise sea, white sand and tanned skin. A preset is a starting point: tweak exposure and white balance for each photo.',go:'pre',gl:'Presets'},
{id:'pg_apply',k:['apply','applying','how to apply','apply it','apply them','use a preset on','export the photo','save the photo after'],a:'How to apply a preset to a photo:\n\n📱 On your phone (Lightroom Mobile):\n1. Open the photo in Lightroom.\n2. At the bottom find the “Presets” tab.\n3. Choose the group where you saved the presets and tap one — the photo changes instantly.\n4. An “Amount” slider appears — set the strength (usually 60–100%).\n5. Tap ✓ and fine-tune: “Light” → exposure, “Color” → temperature.\n6. Save: Share → “Export to Camera Roll”.\n\n💻 On a computer (Lightroom Classic):\n1. Develop module.\n2. Presets panel on the left — hover to preview.\n3. Click a preset to apply. On the right adjust exposure and white balance.\n4. Export: File → Export (Ctrl/Cmd+Shift+E).\n\n🎬 LUTs on video: DaVinci (Color → node → LUTs), Premiere (Lumetri → Creative → Look) or VN (filters → import LUT).\n\nIf the presets aren’t installed yet — ask “how to install presets on my phone”.',go:'pre',gl:'Presets'},
{id:'pg_how',k:['how to use the presets','how to use presets','how do i use','how to apply','instructions','guide','how to use luts','how do i use them','how to use them','how they work','don t know how'],a:'How to use the presets — in short:\n1. Install them in Lightroom (phone — DNG files, computer — XMP).\n2. Open a photo and pick a preset — it is a starting point, not the final look.\n3. Fine-tune for the shot: exposure → white balance → highlights & shadows → colour.\n4. Too strong? Lower the preset Amount.\n5. For a series: finish one photo, copy the settings to the rest, then adjust exposure on each.\nAsk “how to install on my phone” or “what to adjust after the preset” for details.',go:'pre',gl:'Presets'},
{id:'pg_mob',k:['install','installing','how to install','lightroom mobile','create preset','add presets','import presets'],a:'Installing in Lightroom Mobile (iPhone & Android), DNG files:\n1. Save the DNG files to your phone (unzip if needed).\n2. In Lightroom tap “Add photos” and import the DNGs like normal photos.\n3. Open the first DNG → “⋯” (top right) → “Create Preset”.\n4. Name it, choose a group (e.g. “User Presets”) → ✓.\n5. Repeat for each DNG.\nDone: on any photo — “Presets” tab → your group → pick a preset.\nTip: you can delete the DNGs afterwards — the presets stay.',go:'pre',gl:'Presets'},
{id:'pg_pc',k:['on my computer','on computer','lightroom classic','on mac','on windows','laptop'],a:'Installing in Lightroom Classic (macOS & Windows), XMP files:\n1. Unzip the archive.\n2. Open the Develop module.\n3. Presets panel on the left → “+” → “Import Presets”.\n4. Select the XMP files (or the .zip) → “Import”.\nHover a preset to preview, click to apply.\nIn cloud Lightroom (not Classic): Edit → Presets → “⋯” → Import Presets.',go:'pre',gl:'Presets'},
{id:'pg_lut',k:['install lut','install luts','lut in davinci','lut in premiere','apply lut','apply the lut','use luts'],a:'Video LUTs (.cube files):\n• DaVinci Resolve: Project Settings → Color Management → “Open LUT Folder”, copy the .cube files → “Update Lists”. Then on the Color page: right-click a node → LUTs → pick one.\n• Premiere Pro: Lumetri Color → Creative → Look → “Browse…” → choose the .cube.\n• VN and other mobile editors: import the LUT (.cube) in the filters section, then apply to the clip.\nImportant: fix the clip’s exposure and white balance first, then add the LUT. Too strong? Lower the LUT intensity/opacity.',go:'pre',gl:'Presets'},
{id:'pg_tune',k:['what to adjust','what should i adjust','fine tune','fine-tune','after the preset','after applying','doesn t look like','not like the example','which sliders','how to tweak','tweak'],a:'What to adjust after the preset — in order (every photo has different light, so a preset never looks identical without fine-tuning):\n1. Exposure — the face or main subject should read well. Usually ±0.3–1.\n2. White balance: Temp — warmer/cooler, Tint — remove green or magenta. This is the main difference between shots.\n3. Highlights down if the sky or white clothes are blown; Shadows up if details are lost.\n4. Whites slightly up, Blacks slightly down for contrast.\n5. Vibrance/Saturation down if colours are too loud.\n6. Colour (HSL): orange — skin, blue & aqua — sky and water, green — foliage.\n7. Preset Amount — 60–100% to taste.\n8. Night/dark shots — add noise reduction.\nRule: small moves, and compare with the original (long-press the photo).',go:'pre',gl:'Presets'},
{id:'pg_skin',k:['skin','skin tone','orange skin','yellow skin','red skin','face looks orange'],a:'Skin after a preset:\n• Too orange/yellow → Colour (HSL) → Orange: saturation −5…−15, luminance +5…+10.\n• Too red → Red: saturation −5…−10, hue slightly toward orange.\n• Grey or pale → Orange saturation +5, Temp slightly warmer.\n• Greenish (light from foliage) → Tint slightly right, toward magenta.\n• Too harsh → Texture −5…−10, Clarity down.\nKeep it natural — compare with the original.',go:'pre',gl:'Presets'},
{id:'pg_fix',k:['too dark','blown','overexposed','too yellow','too blue','green cast','too bright','too saturated','dull','noise','noisy','ruined','looks bad'],a:'Common problems and fixes:\n• Too dark → Exposure up, Shadows up.\n• Blown sky → Highlights down, Whites down.\n• Everything yellow/orange → Temp cooler.\n• Everything blue → Temp warmer.\n• Green cast → Tint right (toward magenta).\n• Too bright and “acid” → Vibrance/Saturation down or preset Amount 60–80%.\n• Flat and dull → a bit more Contrast or Blacks down.\n• Noise on night photos → Detail → Noise Reduction +20…40.\nPresets work best on RAW with normal exposure; JPEGs and very dark shots need more tweaking.',go:'pre',gl:'Presets'},
{id:'pg_batch',k:['series','many photos','all photos','copy settings','paste settings','sync','batch','same look'],a:'Editing a series consistently:\n• Lightroom Mobile: finish one photo → “⋯” → “Copy Settings” → select the others → “Paste Settings”.\n• Lightroom Classic: finish a photo → select the series → “Sync” (Ctrl/Cmd+Shift+S), choose what to copy.\nThen go through each shot and adjust exposure and temperature — light always differs a little.',go:'pre',gl:'Presets'},
{id:'pg_amt',k:['strength','intensity','amount slider','too strong','weaker','reduce the effect','tone it down'],a:'Preset strength:\n• In Lightroom (Mobile and cloud) there is an “Amount” slider under the selected preset — 0 to 200%. For a soft look use 60–80%.\n• Older Lightroom Classic versions have no such slider — reduce saturation, contrast and Clarity manually.\n• For video LUTs — lower the LUT intensity/opacity in your editor.',go:'pre',gl:'Presets'},
{id:'pg_sea',k:['underwater','sea color','sea colour','water color','water colour','turquoise','beach photos','sky color','sky colour','ocean'],a:'Sea, sky and underwater shots (Maldives presets):\n• Turquoise water: Colour (HSL) → Aqua — hue and saturation to taste; Blue — sky.\n• Blown sky → Highlights down, or a Sky mask with slightly lower exposure.\n• Underwater: use Maldives 05 (underwater), then warmer Temp and Dehaze +10…+30 — water makes everything blue and hazy.\n• Bright sun and white sand: Whites and Highlights down to keep detail.\n• Skin on the beach often turns too orange — lower orange saturation.',go:'pre',gl:'Presets'},
{id:'pre_get',k:['how do i get the presets','how will i receive','download the presets','after payment presets','link to the presets'],a:'After your request Anton Avanzato will message you on Telegram with payment details, and after payment — a link to the presets. Then:\n1. Download and unzip the archive.\n2. Install the presets in Lightroom (ask “how to install presets on my phone”).\n3. Apply them and fine-tune each shot.\nQuestions — Telegram @avanzato.',go:'pre',gl:'Presets'},
{id:'presets',k:['preset','lut','lightroom','color grading','colour grading','maldives colors','maldives colours'],a:'Maldives Presets — signature settings by photographer Anton Avanzato: the colours of the Maldives for your photos and videos in a couple of taps. They bring out details, boost the right tones and remove unwanted colours — a pro result in a few clicks.\n\n• 5 photo presets + 5 video LUTs\n• Lightroom Mobile & Classic, DaVinci, Premiere, VN, Liit\n• price — $40',go:'pre',gl:'Presets'},
{id:'pre_diff',k:['presets vs lut','preset and lut','difference between preset','what is a lut','what are luts','for video','on video'],a:'Presets are photo settings for Lightroom. LUTs are colour tables for video: DaVinci Resolve, Premiere, VN.\nSimply: presets for photos, LUTs for video. The Maldives pack has both: 5 + 5.',go:'pre',gl:'Presets'},
{id:'pre_any',k:['any photo','fit any','work on any','raw','jpeg','jpg','phone photos','my photos'],a:'Presets work best on RAW with normal exposure. Sometimes a small exposure or white balance tweak is all you need.',go:'pre',gl:'Presets'},
{id:'pre_skill',k:['need skills','skills','is it hard','difficult to use','i am a beginner','presets for beginners','no experience','hard to use','never edited','beginner with presets','beginner, can i use presets'],a:'No skills needed — presets apply in one tap, even if you are just starting out.',go:'pre',gl:'Presets'},
{id:'pre_comm',k:['resell','share the files','commercial use','for clients','commercial'],a:'You can use the presets commercially: client shoots, social media, ads, YouTube. Reselling or sharing the files is not allowed.',go:'pre',gl:'Presets'},
{id:'pre_fmt',k:['presets for phone','for my phone','format','dng','xmp','cube','android','iphone','ios','davinci','premiere','vn ','liit','which app','phone','mobile','smartphone','ipad','tablet','computer','laptop','photoshop','on mac','free lightroom','subscription','on my phone','work on my phone','on mobile','work on mobile','for iphone','for android'],a:'Formats and compatibility:\n• Lightroom Mobile (iOS & Android) — DNG files\n• Lightroom Classic (macOS & Windows) — XMP files\n• DaVinci Resolve / Premiere — .cube LUTs\n• mobile video editors VN and Liit',go:'pre',gl:'Presets'},
{id:'pre_color',k:['look the same','different screens','all devices','colour differ','color differ','color looks different'],a:'Colours may differ slightly on different screens. Check the final result on several devices.',go:'pre',gl:'Presets'},
{id:'pre_buy',k:['buy presets','buy the presets','presets price','price of presets','how much are the presets','how to get the presets','purchase presets'],a:'Maldives Presets — $40. Tap “Buy” in the Presets section and enter your Telegram username — Anton Avanzato will message you and send the presets after payment. Questions — Telegram @avanzato.',go:'pre',gl:'Presets'},

/* Незаконченная заявка сохраняется на телефоне: имя, телефон, остров, пожелания — общие; даты, люди, выбор — для каждого вида брони */
const FCOM=['fio','phone','departure_island','isl_other','private_transfer','important_notes'];
const fGet=(k)=>{try{return JSON.parse(localStorage.getItem('alga_f_'+k)||'{}')}catch(e){return{}}};
const fPut=(k,v)=>{try{localStorage.setItem('alga_f_'+k,JSON.stringify(v))}catch(e){}};
function formSave(kind){const f=$('f');if(!f)return;const c={},o={};
  for(const el of f.elements){if(!el.name||el.type==='hidden'||el.name==='company')continue;const v=el.type==='checkbox'?el.checked:el.value;(FCOM.includes(el.name)?c:o)[el.name]=v}
  fPut('common',c);fPut(kind,o)}
function formRestore(kind,keepPick,keepDates){const f=$('f');const data=Object.assign({},fGet(kind),fGet('common'));const today=todayL();
  for(const [n,v] of Object.entries(data)){const el=f.elements[n];if(!el||el.type==='hidden')continue;
    if(keepPick&&el.tagName==='SELECT'&&n!=='departure_island')continue;
    if(el.type==='date'&&(keepDates||!v||v<today))continue;
    if(el.type==='checkbox')el.checked=!!v;else if(v!==''&&v!=null){if(el.tagName==='SELECT'&&![...el.options].some((o)=>o.value===v))continue;el.value=v}}
  if(KIND==='author'){const s=f.author_date_start&&f.author_date_start.value;document.querySelectorAll('#tdates .dc').forEach((c)=>c.classList.toggle('on',(c.getAttribute('onclick')||'').includes("'"+s+"'")))}}
function formClear(kind){fPut(kind,{});const c=fGet('common');delete c.important_notes;fPut('common',c)}
function addClear(){document.querySelectorAll('#f input[name=fio],#f input[name=phone],#f input[name=isl_other],#f textarea').forEach((el)=>{const w=document.createElement('div');w.className='cw';el.parentNode.insertBefore(w,el);w.appendChild(el);if(el.style.display==='none'){w.style.display='none';el.style.display='';const sel=el.form.departure_island;sel.addEventListener('change',()=>{w.style.display=sel.value==='other'?'block':'none'})}const b=document.createElement('button');b.type='button';b.className='clr';b.setAttribute('aria-label','×');b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>';const u=()=>b.style.display=el.value?'flex':'none';b.onclick=()=>{el.value='';u();el.focus()};el.addEventListener('input',u);w.appendChild(b);u()})}
function dCard(x,i,len,act,on){const r=len%3,w=i>=len-r?(r===1?' w6':' w3'):'';const n=Math.round((new Date(x.end)-new Date(x.start))/864e5)+1;return `<button type="button" class="dc${w}${on}" onclick="${act}"><b>${fmt(x.start)}</b><span>${fmt(x.end)}</span><small>${isNaN(n)?'':L==='ru'?n+' '+(n%10===1&&n%100!==11?'день':n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?'дня':'дней'):n+' days'}</small></button>`}

/* RU: строго +7 (XXX) XXX-XX-XX, 8 и 7 в начале превращаются в +7. EN: любой международный номер с +, 7–15 цифр */
function ruDigits(v){v=String(v).trim();let d=v.startsWith('+7')?v.slice(2).replace(/\D/g,''):v.replace(/\D/g,'');if(!v.startsWith('+7')&&d.length>10)d=d.slice(d.length-10);while(/^[78]/.test(d))d=d.slice(1);return d.slice(0,10)}
function ruMask(d){let r='+7';if(d.length)r+=' ('+d.slice(0,3);if(d.length>3)r+=') '+d.slice(3,6);if(d.length>6)r+='-'+d.slice(6,8);if(d.length>8)r+='-'+d.slice(8,10);return r}
function phoneInput(el,ev){if(L==='ru'){if(ev&&ev.inputType&&ev.inputType.startsWith('delete'))return;el.value=ruMask(ruDigits(el.value))}else{let d=el.value.replace(/[^\d]/g,'').slice(0,15);el.value='+'+d}}
function phoneOk(v){return L==='ru'?ruDigits(v).length===10:/^\+\d{7,15}$/.test(v.replace(/[\s()-]/g,''))}
function phoneFmt(v){return L==='ru'?ruMask(ruDigits(v)):'+'+v.replace(/\D/g,'')}
const DATEF={excursion:'excursion_date',hotel:'check_in_date',resort:'resort_date',author:'author_date_start',diving:'diving_date'};
/* ответ клиенту от бота после заявки: разрешение писать (один раз) + запрос в скрипт бота с подписью Telegram */
const THANKS='https://script.google.com/macros/s/AKfycbzkJYlcK_Ha1DBa8jGYEWHyRL_6MktRm6qytWjEXiA0BDckH4ahVRSikz_nTm1JUMMQ/exec?a=thanks';
function thanks(k){try{if(!(tg&&tg.initData))return;const go=()=>fetch(THANKS,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({initData:tg.initData,kind:k||'',lang:L})}).catch(()=>{});if(tg.requestWriteAccess&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9'))tg.requestWriteAccess((ok)=>{if(ok)go()});else go()}catch(e){}}
async function send(ev){ev.preventDefault();const f=$('f'),err=$('err'),b=$('sb');err.textContent='';
  const fd=new FormData(f);
  if(!fd.get(DATEF[KIND])){err.textContent=T.eDate;return false}
  if(!String(fd.get('fio')).trim()){err.textContent=T.eName;return false}
  if(!phoneOk(String(fd.get('phone')))){err.textContent=T.ePhone;return false}
  if(!$('agree').checked){err.textContent=T.agreeErr;return false}
  if(fd.get('departure_island')==='other')fd.set('departure_island',String(fd.get('isl_other')).trim()||'other');
  fd.delete('isl_other');fd.set('phone',phoneFmt(String(fd.get('phone'))));fd.set('service_type',KIND);fd.set('key',KEY);
  const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
  if(u&&u.username)fd.set('important_notes',(String(fd.get('important_notes')||'')+`\nTelegram: @${u.username}`).trim());
  b.disabled=true;b.textContent=T.sending;
  try{const ac=new AbortController(),to=setTimeout(()=>ac.abort(),20000);const r=await fetch(ENDPOINT,{method:'POST',body:new URLSearchParams(fd),signal:ac.signal}).finally(()=>clearTimeout(to));if(!r.ok)throw 0;
    formClear(KIND);thanks(KIND);$('done').innerHTML=`<div class="hero"><h1><span class="okic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>${T.ok}</h1><p>${T.okS}</p></div><button class="btn f" onclick="show('home')">${T.close}</button>${contacts()}`;show('done');
    try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}}
  catch(e){err.textContent=T.fail}finally{b.disabled=!$('agree').checked;b.textContent=T.send}return false}

function cmpAt(pct){pct=Math.max(0,Math.min(100,pct));const a=$('pa'),h=$('ha');if(!a)return;a.style.clipPath=`inset(0 0 0 ${pct}%)`;h.style.left=pct+'%'}
function setP(i){pIdx=i;document.querySelectorAll('#pchips .chip').forEach((c,j)=>c.classList.toggle('on',j===i));

  ['pointerup','pointercancel'].forEach((ev)=>w.addEventListener(ev,()=>{drag=false}))}

    busy=true;const b=q('pgo');b.disabled=true;b.textContent=PT.sending;try{i.blur()}catch(e){}

  /* Свайп вниз закрывает окно */

function zSwipe(w,len,step){let x0=null,y0=0,dx=0,dy=0,lock=0;const im=()=>w.querySelector('img');
  w.addEventListener('touchstart',(e)=>{e.stopPropagation();if(e.touches.length!==1)return;x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=dy=0;lock=0;const i=im();if(i)i.style.transition='none';w.style.transition='none'},{passive:true});
  w.addEventListener('touchmove',(e)=>{if(x0===null)return;dx=e.touches[0].clientX-x0;dy=e.touches[0].clientY-y0;
    if(!lock&&(Math.abs(dx)>8||Math.abs(dy)>8))lock=Math.abs(dy)>Math.abs(dx)?2:1;
    if(lock===2){e.preventDefault();const d=Math.max(0,dy),i=im();if(i)i.style.transform=`translateY(${d}px) scale(${1-Math.min(d,400)/2000})`;w.style.backgroundColor=`rgba(0,0,0,${.92*(1-Math.min(d,300)/400)})`}},{passive:false});
  w.addEventListener('touchend',(e)=>{if(x0===null)return;x0=null;const i=im();
    if(lock===2){e.preventDefault();if(dy>90){hap();if(i){i.style.transition='transform .2s ease,opacity .2s';i.style.transform=`translateY(${innerHeight}px)`;i.style.opacity='0'}w.style.transition='opacity .2s';w.style.opacity='0';setTimeout(()=>w.remove(),200)}
      else{if(i){i.style.transition='transform .2s ease';i.style.transform=''}w.style.transition='background-color .2s';w.style.backgroundColor=''}return}
    if(lock===1&&Math.abs(dx)>50&&len>1){e.preventDefault();step(dx<0?1:-1)}})}
function xZoom(i,k){const g=XD[xSlug(D[L].excursions[i])].gal;let n=k;const w=document.createElement('div');w.className='xz';
  const draw=()=>{w.innerHTML=`<img src="${esc(g[n][1])}" alt=""><span class="xzc">${n+1} / ${g.length}</span><button class="xzx" aria-label="close">×</button>`};draw();
  zSwipe(w,g.length,(d)=>{n=(n+d+g.length)%g.length;draw()});
  w.onclick=(e)=>{if(e.target.tagName!=='IMG'||g.length<2){w.remove();return}n=(n+1)%g.length;draw()};

/* Сезон отеля → даты в форме: «November 1 – December 20, 2026» → 2026-11-01 … 2026-12-20 */
function hRange(t){const M={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  const m=String(t).toLowerCase().match(/([a-z]{3})[a-z]*\.?\s+(\d{1,2})\D+?([a-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(20\d\d)/);if(!m||!M[m[1]]||!M[m[3]])return null;
  const y2=+m[5],y1=M[m[1]]>M[m[3]]?y2-1:y2,p=(x)=>String(x).padStart(2,'0');
  return [y1+'-'+p(M[m[1]])+'-'+p(m[2]),y2+'-'+p(M[m[3]])+'-'+p(m[4])]}

  const tom=add(todayL(),1);if(r[1]<=tom){openForm('hotel',i);return}

  openForm('hotel',i,ci,co)}
