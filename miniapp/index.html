 {id:'sharks',k:['акул','нянь','дельфин','скат','песчаная кос','косу','коса','на акул'],a:'Экскурсия «Акулы, песчаная коса, дельфины и скаты» — $65 с человека (все таксы и сборы включены):\n• дети 3–10 лет — $40, до 3 лет — бесплатно\n• приватный тур — $2000 (до 18 человек)\n\nСбор в 7:45, выход от причала Маафуши в 8:00: дельфины → скаты → снорклинг с акулами-няньками → песчаная коса. Возвращение в 14:30.\nВключены снаряжение, ланч, вода, полотенца. Съёмка с дрона — $20 с человека за локацию.\n\n⚠️ ВСЕГДА слушайте гида. Не подплывайте к винтам катера. Спросите «правила безопасности» — расскажу всё.',go:'exc',gl:'Экскурсии'},
 {id:'whale',k:['китов','кит ','манта','мант','manta'],a:'Снорклинг с китовой акулой — $110 с человека (все таксы и сборы включены):\n• дети 3–10 лет — $70\n• приватный тур — $2500 (до 18 человек)\nПроводится при полной группе — от 10 человек.\n\nСбор в 7:00, выход в 7:30: китовая акула → лагуна с мантами → остров «Пикник» (ланч, вода, полотенца, свободное время). Возвращение в 15:00.\n\n⚠️ ВСЕГДА слушайте гида. Не подплывайте к винтам катера. Спросите «правила безопасности» — расскажу всё.',go:'exc',gl:'Экскурсии'},
 {id:'half',k:['half','полдня','пол дня','каафу','черепах','немо','лобстер','биягу','бияду','куда гири','гули','короткая','короткую'],a:'Half Day (атолл Каафу) — $35 с человека (все таксы и сборы включены):\n• дети 3–10 лет — $25\n• приватный тур — $1000 (до 18 человек)\n\nСбор в 9:45, выход в 10:00: риф Бияду (черепахи, рифовая акула, мурена, немо) → риф «Куда Гири» (лобстер, осьминог, кораллы) → локальный остров Гули: ланч, вода, полотенца, свободное время. Возвращение в 14:30.\n\n⚠️ ВСЕГДА слушайте гида. Не подплывайте к винтам катера. Спросите «правила безопасности» — расскажу всё.',go:'exc',gl:'Экскурсии'},
 {id:'aqua',k:['аквариум','отмел','sand bank','риф'],a:'Экскурсия «Аквариум» — $80 с человека (все таксы и сборы включены):\n• дети до 10 лет — $60, до 3 лет — бесплатно\n• приватный тур — $1800 (до 18 человек)\n\nСбор в 9:00, выход в 9:15: «Аквариум» со скатами → снорклинг на рифе → песчаная отмель: ланч, вода, полотенца, зонты. Возвращение в 15:00.\n\n⚠️ ВСЕГДА слушайте гида. Не подплывайте к винтам катера. Спросите «правила безопасности» — расскажу всё.',go:'exc',gl:'Экскурсии'},
 {id:'male',k:['мале','столиц','рынок','рынк','мечет','сувенир','город'],a:'Экскурсия по Мале — столице Мальдив, с гидом. Цена с человека (все таксы и сборы включены):\n• 2–4 человека — $40\n• 5–8 человек — $30\n• 9–16 человек — $25\n• от 20 человек — $20\n\nРыбный и фруктовый рынки, центральная площадь и мечеть, достопримечательности, сувениры. Включены паром из аэропорта и обратно, гид, хранение багажа. Не включены: еда, напитки и входные билеты (по желанию).',go:'exc',gl:'Экскурсии'},

 {id:'priv',k:['приват','индивидуальн','свою компани','только для нас','отдельный катер','персональн','частн','только наша','только мы','наша семья на катере','своей семьей','свой катер','без группы','без чужих'],a:'Приватные экскурсии — катер только для вашей компании (до 18 человек):\n• Акулы и коса — $2000\n• Китовая акула — $2500\n• Аквариум — $1800\n• Half Day — $1000\nМожно собрать и индивидуальный маршрут — напишите даты и пожелания.',go:'form',gl:'Оставить заявку'},
 {id:'drone',k:['дрон','с дрона','съемка с дрон','съемку с дрон','квадрокоптер','с воздуха','mavic'],a:'Съёмка с дрона (DJI Mavic Pro 3) на экскурсии «Акулы и коса» — $20 с человека за каждую локацию (на акулах и на песчаной косе), оплачивается отдельно.\nНа фотосессиях: с дрона — +$100, только дрон — $150.\n\n⚠️ Во время съёмки с дрона НЕ раскидывайте руки и не трогайте акул. ВСЕГДА слушайте гида.'},

 {id:'equip',k:['снаряж','маск','ласт','трубк','жилет','что взять','что с собой','полотенц','обед','ланч','еда','кормят','кормят на экскурс','что дают на экскурс','что включено в экскурс','что входит в экскурс','вода есть','вода на катере','попить'],a:'На экскурсиях выдаём снаряжение: маски, ласты, трубки и жилеты. Также включены ланч, вода и пляжные полотенца (на «Аквариуме» — ещё и зонты от солнца).\nНа экскурсию по Мале еда и напитки не включены.'},
 {id:'safety',k:['правила безопасн','техника безопасн','безопасность на экскурс','правила поведен','правила на экскурс','что нельзя','нельзя делать','чего нельзя','винт','у катера','около катера','руки на дрон','раскидывать рук','расставлять рук','трогать акул','трогать скат','трогать черепах','можно трогать','можно потрогать','кормить','покормить','коралл','слушать гида','инструктаж'],a:'⚠️ ПРАВИЛА БЕЗОПАСНОСТИ — ОБЯЗАТЕЛЬНО ДЛЯ ВСЕХ ⚠️\n\n‼️ ВСЕГДА СЛУШАЙТЕ ГИДА. ВСЕГДА. Без исключений. Гид знает море, течения и животных — его слово главное.\n\n🚤 Катер:\n• НЕ подплывайте к винтам и к корме катера — это смертельно опасно.\n• Не прыгайте в воду и не забирайтесь на катер без команды гида.\n• Пока катер движется или заводит мотор — все остаются на борту.\n\n🦈 Акулы и скаты:\n• Во время съёмки с дрона НЕ РАСКИДЫВАЙТЕ РУКИ в стороны — держите их ближе к телу.\n• НЕ трогайте, не хватайте и не кормите акул, скатов, черепах и рыб.\n• Не плывите на животных и не гоняйтесь за ними — двигайтесь спокойно.\n\n🌊 В воде:\n• Не умеете плавать или плаваете плохо — жилет обязательно, не снимайте его.\n• Держитесь группы и в зоне видимости гида, не уплывайте далеко.\n• Не вставайте на кораллы и не трогайте их — можно порезаться, а рифы погибают.\n• Почувствовали усталость, холод или страх — поднимите руку, гид поможет.\n\n☀️ Солнце: солнцезащитный крем, головной убор и вода — солнечный ожог не причина для возврата или переноса экскурсии.\n\nЕщё раз: СЛУШАЙТЕ ГИДА. Это ваша безопасность.',go:'exc',gl:'Экскурсии'},
{id:'swim',k:['не умею плават','плохо плава','не плаваю','боюсь','страшно','безопасн','опасн','кусают','кусаются','нападают','не умеет плават','ребенок не умеет'],a:'На экскурсиях выдаём жилеты, маски и ласты, рядом всегда наши ребята — плавать с акулами-няньками и скатами спокойно и безопасно, многие гости решаются впервые. Если есть сомнения — напишите, подберём формат.\n\n⚠️ ВСЕГДА слушайте гида. Не подплывайте к винтам катера. Спросите «правила безопасности» — расскажу всё.',go:'mgr',gl:'Написать менеджеру'},

{id:'tour',k:['авторск','тур','маршрут','групп','5 остров','7 остров','путешеств','тур на неделю'],w:['сколько','стоит','цен'],a:'Авторский тур на Маафуши — от $1960:\n• 5–7 островов и подводный мир\n• фото- и видеосъёмка\n• группы 8–12 человек\n• комфортное размещение, морские прогулки, лучшие локации\n\n✈️ Перелёт в стоимость не входит — билеты до Мале покупаете отдельно. Бывают недорогие билеты на Мальдивы, но их нужно ловить отдельно.\n\nДаты 2026–2027: 01.11–08.11, 30.12–06.01 (Новый год), 24.01–31.01, 13.02–20.02, 06.03–13.03, 20.03–27.03, 03.04–10.04, 28.04–05.05.',go:'tour',gl:'Забронировать тур'},

 {id:'dive',k:['дайв','погружен','акваланг','scuba','open water','advanced','сертификат дайв','padi','shark tank','нырять','нырнуть','с инструктор'],a:'Дайвинг с инструктором — от $55:\n• Discover Scuba Diving — первое погружение для новичков, 2–3 часа\n• Shark Tank Dive — погружение к акулам, для дайверов с опытом\n• Single Dive — разовое погружение для сертифицированных дайверов (баллоны, грузы, гид, трансфер включены)\n• Open Water Diver — международный сертификат, до 18 м, 3–4 дня\n• Advanced Open Water — до 30 м, 2–3 дня\nФото и видео включены.',go:'dive',gl:'Дайвинг'},
 {id:'active',k:['парасейл','гидроцикл','флайборд','серф','банан','каяк','sup','сап','вейк','водные лыж','водные развлеч','активн','jet','парашют'],a:'Водные развлечения на Маафуши: парасейлинг, гидроциклы и Jet Car, флайборд, вейкбординг и водные лыжи, банан и Fun Tube, каяки и SUP, серфинг, пакеты для двоих. Работаем с проверенными операторами. Стоимость зависит от сезона и погоды — уточните у менеджера.',go:'mgr',gl:'Узнать цены'},
 {id:'photo',k:['фотосесс','фотограф','фотосъем','съемк','снимок','портфолио','на пляже','снимете нас','сфотографир'],a:'Фотосессии на Мальдивах:\n• На резорте — от $250: 2 часа съёмки (входной билет и трансфер фотографа отдельно)\n• На необитаемом острове или косе — от $200: 1,5 часа (трансфер от $100)\n• Дрон — +$100, только дрон — $150\nВсе исходники отдаём в тот же день на ваш носитель (от 32 ГБ), 10 фото в ретуши и 30 в цветокоррекции — в течение 2 недель после отбора.',go:'mgr',gl:'Заказать съёмку'},
 {id:'wed',k:['свадьб','церемон','жених','невест','помолвк','обручен','брак','предложение руки','предложение','сделать предложение'],a:'Свадебная церемония на локальном или необитаемом острове — от $700:\n• фотограф 2 часа: все исходники, 10 фото в ретуши, 30 в цветокоррекции\n• оформление арки, церемония и сертификат\n• букет невесты (прокат, искусственные цветы)\nЦеремонию на английском проводит мальдивец в национальной одежде. Макияж и причёска — отдельно (из Мале, от $150), видео — от $150.',go:'mgr',gl:'Обсудить свадьбу'},
 {id:'terms',k:['условия бронир','правила бронир','обязательные услов','услови','политика бронир','политика отмен','соглашени','оферт','правила отмены и возврат'],a:'Условия бронирования экскурсий ALGA:\n\n💳 Оплата\n• Предоплата — $10 с человека за каждую экскурсию: невозвратная, входит в стоимость. Вносится в рублях по курсу USD (Россельхозбанк, покупка).\n• Остаток: рублями переводом на карту (резорты — только наличные USD), наличными USD или картой VISA / MasterCard / UnionPay в офисе — комиссия Банка Мальдив 4%.\n• Полная оплата — не позднее чем за 2 дня до экскурсии, иначе бронь может считаться отменённой по инициативе клиента.\n\n🔁 Перенос — один раз, не позднее чем за 5 дней, при наличии группы и мест.\n\n❌ Отмена\n• Вы отменяете за 24+ часа — возврат за вычетом предоплаты; менее чем за 24 часа — без возврата.\n• Отменяет компания — 100% возврат в течение 1 рабочего дня.\n• Экскурсии групповые: дата зависит от набора группы и погоды, поэтому компания может её перенести.\n\n🤒 Болезнь — возврат или перенос только по медицинской справке (на каждого участника). Солнечный ожог и критические дни — не причина для возврата или переноса.\n\n🕔 Офис — ежедневно 17:00–22:00, в другое время пишите менеджеру.\n\nБронируя экскурсии в ALGA TOURS, вы соглашаетесь с политикой бронирования и отмены.',go:'mgr',gl:'Написать менеджеру'},
{id:'full',k:['полная оплат','полную оплат','полностью оплат','оплатить полностью','всю сумму','когда доплат','до какого числа оплат','за сколько дней оплат','когда нужно оплатить'],a:'Полную оплату экскурсии нужно внести не позднее чем за 2 дня до её даты. Если полная оплата не произведена, компания вправе считать бронь отменённой по инициативе клиента.\nСпособы: рублями на карту (резорты — только наличные USD), наличными USD или картой в офисе (комиссия 4%).'},
{id:'ill',k:['заболе','болезн','болею','болен','больна','простуд','температур','справк','отравил','плохо себя чувств','ожог','обгорел','обгорела','критическ','месячн','если заболею','если заболел','заболею вернете'],a:'Если вы заболели:\nЕсли о болезни стало известно за 24 часа до экскурсии и вы хотите отменить — для возврата или переноса нужно:\n1. Сообщить менеджеру ALGA письменно (в мессенджере).\n2. Предоставить медицинскую справку о противопоказаниях на дату экскурсии — её можно получить в больнице на острове Маафуши.\n3. Справка нужна на каждого участника отдельно.\n⚠️ Без справки бронь считается отменённой без возврата и переноса.\n\n❗ Не являются причиной для возврата или переноса:\n• солнечный ожог\n• критические дни\nРиски, связанные со страной пребывания, гость учитывает самостоятельно.',go:'mgr',gl:'Написать менеджеру'},
{id:'datechg',k:['перенесли экскурс','компания перенес','могут перенести','вы можете перенести','почему перенес','изменили дату','поменяли дату','не набралась групп','набор групп','групповые экскурс'],a:'Экскурсии ALGA групповые: дата зависит от набора группы и погодных условий. Поэтому компания оставляет за собой право перенести экскурсию, если это необходимо.\nЕсли экскурсию отменяет компания — 100% возврат оплаченной суммы в течение 1 рабочего дня.'},
{id:'hours',k:['часы работы','график работы','режим работы','во сколько работает','когда работает офис','офис работает','до скольки','со скольки','время работы'],a:'Офис ALGA на Маафуши работает ежедневно с 17:00 до 22:00. В другое время пишите менеджеру в WhatsApp или Telegram — мы на связи 24/7.\nФото и видео с экскурсии можно забрать в офисе в тот же день, с 19:00 до 22:00.'},
{id:'prepay',k:['предоплат','аванс','залог','бронирован','как забронир','забронир','бронь','платить заранее','заранее платить','бронь экскурс','забронировать экскурс'],a:'Предоплата:\n• экскурсии — $10 с человека за каждую экскурсию (невозвратная, входит в стоимость)\n• отели — 20% от стоимости, из них 2000 ₽ невозвратные\nПредоплата вносится в рублях по курсу USD (Россельхозбанк, покупка). Экскурсию нужно полностью оплатить не позднее чем за 2 дня, иначе бронь может быть отменена.',go:'form',gl:'Оставить заявку'},
 {id:'pay',k:['оплат','как плат','картой','карту','наличн','доллар','usd','рубл','перевод','комисс','visa','mastercard','union','как оплачива','оплачивается'],a:'Оплата остатка:\n• рублями переводом на карту (кроме резортов — там только наличные USD)\n• наличными USD в офисе\n• картой VISA / MasterCard / UnionPay в офисе, если карта работает за границей — комиссия Банка Мальдив 4%\nПредоплата — в рублях по курсу USD (Россельхозбанк, покупка).'},
 {id:'cancel',k:['отмен','отказ','возврат','вернут','вернете','не смогу','погода плох','плохая погода','шторм','из за погод','если погода','передума'],a:'Отмена экскурсии:\n• если отменяете вы за 24+ часа — возврат за вычетом предоплаты\n• менее чем за 24 часа — без возврата\n• если отменяет компания (например, из-за погоды) — 100% возврат в течение 1 рабочего дня'},

 {id:'visa',k:['виз','паспорт','разрешени','граница','въезд','загранпаспорт','загран'],a:'Гражданам России виза на Мальдивы не нужна: бесплатное разрешение на пребывание до 30 дней ставят в паспорт по прилёте.'},
 {id:'contact',k:['связ','контакт','whatsapp','ватсап','вотсап','телеграм','telegram','позвон','написать','менеджер','катя','катерин','екатерин','ответ','телефон','номер тел'],a:'Мы на связи 24/7 в WhatsApp и Telegram, среднее время ответа — около 15 минут. Или оставьте заявку прямо в приложении.',go:'mgr',gl:'Написать в Telegram'},
 {id:'about',k:['кто вы','о вас','о компани','агентств','alga','алга','основател','давно','опыт','надежн','чем занимает','кто такие'],a:'ALGA — туристическое агентство на Мальдивах. Основатель — Екатерина: больше 10 лет живёт на Мальдивах, создаёт авторские туры, организует экскурсии и лично сопровождает гостей. Работаем с отелями по прямым контрактам, без посредников, поддержка 24/7.'},

 {id:'island',k:['маафуши','maafushi','локальный остров','где вы','где находит','офис','причал','как вас найти','найти вас'],a:'Мы базируемся на острове Маафуши — экскурсии и выезды на резорты стартуют от причала Маафуши, там же наш офис (фото с экскурсий, оплата наличными или картой).'},
 {id:'pg_how',k:['как пользоваться пресет','как использовать пресет','как применить пресет','как работать с пресет','инструкция пресет','инструкция к пресет','как пользоваться лут','как применять пресет','пользоват','как ими','как их использ','как использоват','инструкц','как применят','не знаю как','как работают пресет','как работает пресет'],a:'Как пользоваться пресетами — коротко:\n1. Установите пресеты в Lightroom (на телефоне — файлы DNG, на компьютере — XMP).\n2. Откройте фото и выберите пресет — это стартовая точка, не финал.\n3. Подкрутите под конкретный кадр: экспозиция → баланс белого → света и тени → цвет.\n4. Если эффект слишком сильный — уменьшите «Величину» пресета.\n5. Для серии: доведите одно фото и скопируйте настройки на остальные, потом поправьте экспозицию на каждом.\nСпросите «как установить на телефон» или «что подкручивать после пресета» — расскажу подробно.',go:'pre',gl:'Пресеты'},
{id:'pg_mob',k:['установить пресет','установка пресет','как установить','добавить пресет','загрузить пресет','импорт пресет','dng установ','lightroom mobile','лайтрум на телефон','создать стиль'],a:'Установка в Lightroom Mobile (iPhone и Android), файлы DNG:\n1. Сохраните DNG-файлы пресетов на телефон (распакуйте архив, если он в .zip).\n2. В Lightroom нажмите «Добавить фото» и импортируйте эти DNG как обычные снимки.\n3. Откройте первый DNG → «⋯» (вверху справа) → «Создать стиль».\n4. Дайте название, выберите группу (например, «Мои стили») → ✓.\n5. Повторите для каждого DNG.\nГотово: на любом фото — вкладка «Стили» → ваша группа → выбирайте пресет.\nСовет: DNG-файлы после этого можно удалить из Lightroom — стили останутся.',go:'pre',gl:'Пресеты'},
{id:'pg_pc',k:['на компьютер','на ноутбук','lightroom classic','лайтрум классик','xmp установ','на мак','на macbook','на windows','на виндоус'],a:'Установка в Lightroom Classic (macOS и Windows), файлы XMP:\n1. Распакуйте архив.\n2. Откройте модуль «Develop / Обработка».\n3. Слева панель «Presets / Стили» → «+» → «Import Presets / Импорт стилей».\n4. Выберите XMP-файлы (или сразу .zip) → «Import».\nПресеты появятся в панели слева — наведите курсор, чтобы увидеть превью, клик — применить.\nВ Lightroom (облачном, не Classic): «Правка» → «Стили» → «⋯» → «Импорт стилей».',go:'pre',gl:'Пресеты'},
{id:'pg_lut',k:['как установить lut','как установить лут','lut в davinci','лут в давинчи','lut в premiere','лут в премьер','cube установ','как применить lut','как применить лут','лут на видео'],a:'LUT для видео (файлы .cube):\n• DaVinci Resolve: Project Settings → Color Management → «Open LUT Folder», скопируйте туда .cube → «Update Lists». Дальше на странице Color: правый клик по ноде → LUTs → выберите LUT.\n• Premiere Pro: панель Lumetri Color → Creative → Look → «Browse…» → выберите .cube.\n• VN и другие мобильные редакторы: в разделе фильтров — импорт LUT (.cube), затем примените к клипу.\nВажно: сначала выровняйте экспозицию и баланс белого клипа, потом LUT. Если цвет слишком сильный — уменьшите интенсивность или непрозрачность LUT.',go:'pre',gl:'Пресеты'},
{id:'pg_tune',k:['что подкручивать','что подкрутить','что крутить','как доводить','как довести','доработать после пресет','после пресета','не так выглядит','выглядит не так','не как в примере','не как на примере','не получается как','какие ползунки','что настроить','как настроить пресет'],a:'Что подкручивать после пресета — по порядку (на каждом фото свой свет, поэтому один пресет не даёт одинаковый результат без доводки):\n1. Экспозиция — лицо или главный объект должен быть хорошо читаем. Обычно ±0,3–1.\n2. Баланс белого: «Температура» — теплее/холоднее, «Оттенок» — убрать зелень или пурпур. Это главное отличие между кадрами.\n3. Света — вниз, если пересвечено небо или белая одежда. Тени — вверх, если провалились детали.\n4. Белые и чёрные — для контраста: белые чуть вверх, чёрные чуть вниз.\n5. Красочность/насыщенность — уменьшите, если цвета «кричат».\n6. Цвет (HSL): оранжевый — кожа, синий и бирюзовый — небо и вода, зелёный — листва.\n7. «Величина» пресета — 60–100%, по вкусу.\n8. Ночные и тёмные кадры — добавьте шумоподавление.\nПравило: двигайте ползунки понемногу и сравнивайте с оригиналом (долгое нажатие на фото).',go:'pre',gl:'Пресеты'},
{id:'pg_skin',k:['кожа после пресет','кожа оранжев','кожа желт','кожа красн','кожа зелен','кожа сер','оранжевая кожа','желтая кожа','тон кожи пресет','цвет кожи пресет','лицо оранжев','лицо желт','кожа оранжевая после','оранжевая после пресет','кожа после'],a:'Кожа после пресета:\n• Слишком оранжевая или жёлтая → Цвет (HSL) → Оранжевый: насыщенность −5…−15, яркость +5…+10.\n• Слишком красная → Красный: насыщенность −5…−10, оттенок чуть к оранжевому.\n• Серая или бледная → Оранжевый: насыщенность +5, температура чуть теплее.\n• Зеленоватая (свет от листвы) → «Оттенок» в балансе белого чуть вправо, к пурпуру.\n• Слишком контрастная → «Текстура» −5…−10, «Ясность» вниз.\nГлавное — естественность: сравнивайте с оригиналом.',go:'pre',gl:'Пресеты'},
{id:'pg_fix',k:['слишком темно','слишком темное','темное фото','пересвет','все желтое','все синее','зеленый оттенок','слишком ярко','кислотн','блекл','шум на фото','шумит','фото испортил','пресет испорт','плохо легло','плохо ложится'],a:'Частые проблемы и как исправить:\n• Слишком темно → Экспозиция вверх, Тени вверх.\n• Пересвечено небо → Света вниз, Белые вниз.\n• Всё жёлтое/оранжевое → Температура холоднее.\n• Всё синее → Температура теплее.\n• Зелёный оттенок → Оттенок вправо (к пурпуру).\n• Слишком ярко и «кислотно» → Красочность/насыщенность вниз или «Величина» пресета 60–80%.\n• Плоско и блёкло → Контраст или Чёрные вниз чуть-чуть.\n• Шум на ночных фото → Детализация → Шумоподавление +20…40.\nПресет лучше всего ложится на RAW с нормальной экспозицией; на JPEG и сильно тёмных кадрах доводки нужно больше.',go:'pre',gl:'Пресеты'},
{id:'pg_batch',k:['серию фото','на все фото','сразу на несколько','много фото сразу','скопировать настройк','копировать настройк','синхрониз','одинаково обработ','пакетн'],a:'Как обработать серию одинаково:\n• Lightroom Mobile: доведите одно фото → «⋯» → «Копировать настройки» → выделите остальные → «Вставить настройки».\n• Lightroom Classic: доведите фото → выделите серию → «Sync / Синхронизировать» (или Ctrl/Cmd+Shift+S), выберите, что переносить.\nПосле этого пройдитесь по каждому кадру и поправьте экспозицию и температуру — свет между кадрами всегда немного разный.',go:'pre',gl:'Пресеты'},
{id:'pg_amt',k:['сила пресет','интенсивност','величина пресет','ослабить пресет','слабее пресет','слишком сильн','уменьшить эффект','процент пресет'],a:'Сила пресета:\n• В Lightroom (Mobile и обычный) под выбранным стилем есть ползунок «Величина» — от 0 до 200%. Для мягкого результата — 60–80%.\n• В старых версиях Lightroom Classic такого ползунка нет — уменьшайте вручную насыщенность, контраст и «Ясность».\n• Для видео-LUT — уменьшите интенсивность/непрозрачность LUT в редакторе.',go:'pre',gl:'Пресеты'},
{id:'pg_sea',k:['подводн','под водой','цвет моря','цвет воды','бирюз','море на фото','фото на пляже','цвет неба','небо на фото','океан'],a:'Море, небо и подводные фото (пресеты Maldives):\n• Бирюза воды: Цвет (HSL) → Голубой/Аква — оттенок и насыщенность под ваш вкус; Синий — небо.\n• Небо пересвечено → Света вниз, можно маску «Небо» и чуть убрать экспозицию.\n• Подводные кадры: используйте Maldives 05 (подводный), затем температуру теплее и «Удаление дымки» +10…+30 — под водой всё синит и «мутит».\n• Яркое солнце и белый песок: Белые и Света вниз, чтобы не терять детали.\n• Кожа на пляже часто становится слишком оранжевой — уберите насыщенность оранжевого.',go:'pre',gl:'Пресеты'},
{id:'presets',k:['пресет','lut','лут','lightroom','лайтрум','обработк фото','обработка фото с мальдив','цвет мальдив','для чего пресет','зачем пресет','что такое пресет','что дают пресет'],a:'Пресеты Maldives — авторские настройки фотографа Антона Аванзато: цвет Мальдив для ваших фото и видео в пару касаний. Они подчёркивают детали, усиливают нужные оттенки и убирают лишние цвета — профессиональный результат в несколько кликов.\n\n• 5 пресетов для фото + 5 LUT для видео\n• Lightroom Mobile и Classic, DaVinci, Premiere, VN, Liit\n• цена — 3 000 ₽',go:'pre',gl:'Пресеты'},
{id:'pre_diff',k:['чем пресеты отлича','пресет и lut','пресеты и лут','разница пресет','отличие пресет','что такое lut','что такое лут','lut это'],a:'Пресеты — настройки для обработки фото в Lightroom. LUT — таблицы цвета для видео: DaVinci Resolve, Premiere, VN.\nПроще: пресеты — для фото, LUT — для видео. В наборе Maldives есть и то и другое: 5 + 5.',go:'pre',gl:'Пресеты'},
{id:'pre_any',k:['к любым фото','любые фото','на любых фото','подойдут ли','с телефона фото','на айфон','raw','рав ','jpeg','jpg'],a:'Лучше всего пресеты работают на RAW при нормальной экспозиции. Иногда достаточно чуть подправить экспозицию или баланс белого — и результат будет идеальным.',go:'pre',gl:'Пресеты'},
{id:'pre_skill',k:['нужны ли навык','навык','сложно ли','я новичок','не умею обрабат','умею ли','пресеты для новичк','новичок справ'],a:'Профессиональные навыки не нужны — пресеты применяются в одно касание, даже если вы только начинаете.',go:'pre',gl:'Пресеты'},
{id:'pre_comm',k:['перепрод','передать файл','поделиться пресет','для коммерц','коммерческ','для клиент','для рекламы пресет'],a:'Пресеты можно использовать в коммерческих проектах: клиентские съёмки, соцсети, реклама, YouTube. Нельзя только перепродавать и передавать файлы третьим лицам.',go:'pre',gl:'Пресеты'},
{id:'pre_fmt',k:['пресеты для телефон','на телефон пресет','для телефона','формат','dng','xmp','cube','android','андроид','iphone','айфон','davinci','премьер','premiere','vn ','liit','в каком приложени'],a:'Форматы и совместимость:\n• Lightroom Mobile (iOS и Android) — файлы DNG\n• Lightroom Classic (macOS и Windows) — файлы XMP\n• DaVinci Resolve / Premiere — LUT в формате .cube\n• мобильные видеоредакторы VN и Liit',go:'pre',gl:'Пресеты'},
{id:'pre_color',k:['цвет отлича','на разных экран','на всех устройств','одинаково выгляд'],a:'Цвет может немного отличаться из-за разных экранов. Финальный результат лучше проверять на нескольких устройствах.',go:'pre',gl:'Пресеты'},
{id:'pre_buy',k:['купить пресет','как купить пресет','сколько стоят пресет','цена пресет','стоимость пресет','оплатить пресет','получить пресет','как получу пресет'],a:'Пресеты Maldives — 3 000 ₽. Нажмите «Купить» в разделе «Пресеты» и укажите ваш ник в Telegram — Антон Аванзато напишет вам и пришлёт пресеты после оплаты. Вопросы — в Telegram @avanzato.',go:'pre',gl:'Пресеты'},

 {id:'exc',k:['what excursions','which excursions','list of excursions','all excursions','excursions ','tours from maafushi','things to do','what to do','snorkel','prices','price list','what can we do','boat trip','what s fun','fun to do','sea trip'],w:['excursion','trip','price','prices','cost','how much'],a:'Boat excursions from Maafushi:\n• Sharks, sandbank, dolphins & rays — $65\n• Whale shark & manta snorkeling — $110\n• Half Day: turtles, reef shark, Nemo (Kaafu Atoll) — $35\n• Aquarium: rays, reef, sandbank — $80\n• Malé — capital city tour — from $20\nPrices per person, all taxes and fees included.',go:'exc',gl:'All excursions'},
 {id:'sharks',k:['shark','nurse','dolphin','sting','ray ','rays','sandbank','sand bank','sand spit'],a:'Sharks, sandbank, dolphins & rays — $65 per person (all taxes and fees included):\n• children 3–10 — $40, under 3 — free\n• private trip — $2000 (up to 18 people)\n\nMeet at 7:45, departure from Maafushi pier at 8:00: dolphins → rays → snorkeling with nurse sharks → sandbank. Back at 14:30.\nGear, lunch, water and towels included. Drone footage — $20 per person per location.\n\n⚠️ ALWAYS listen to the guide. Never swim near the boat propellers. Ask “safety rules” for the full list.',go:'exc',gl:'Excursions'},

 {id:'aqua',k:['aquarium','reef','reef snorkel'],a:'Aquarium excursion — $80 per person (all taxes and fees included):\n• children under 10 — $60, under 3 — free\n• private trip — $1800 (up to 18 people)\n\nMeet at 9:00, departure at 9:15: the Aquarium spot with rays → reef snorkeling → sandbank: lunch, water, towels, sun umbrellas. Back at 15:00.\n\n⚠️ ALWAYS listen to the guide. Never swim near the boat propellers. Ask “safety rules” for the full list.',go:'exc',gl:'Excursions'},

 {id:'photos',k:['photos from','videos from','get the photos','pick up photos','when photos','where photos','photo and video','get our photos','our photos','the photos'],a:'You can pick up photos and videos from the excursion at our agency the same day, from 19:00 to 22:00.'},
 {id:'equip',k:['gear','equipment','mask','fins','snorkel gear','life jacket','vest','what to bring','towel','lunch','food','meal','what is included in the excursion','water provided','drinking water','what s included','is included'],a:'On excursions we provide gear: masks, fins, snorkels and life vests. Lunch, water and beach towels are included too (on the Aquarium trip — also sun umbrellas).\nFood and drinks are not included on the Malé tour.'},
 {id:'safety',k:['safety rules','rules','what not to do','not allowed','propeller','near the boat','spread my arms','arms','touch','feed','coral','listen to the guide','briefing','touch the shark','touch a shark','touch the ray','touch the turtle','can i touch'],a:'⚠️ SAFETY RULES — MANDATORY FOR EVERYONE ⚠️\n\n‼️ ALWAYS LISTEN TO THE GUIDE. ALWAYS. No exceptions. The guide knows the sea, the currents and the animals — their word is final.\n\n🚤 Boat:\n• Do NOT swim near the propellers or the back of the boat — it can be fatal.\n• Do not jump in or climb aboard without the guide’s signal.\n• While the boat is moving or the engine is starting — everyone stays on board.\n\n🦈 Sharks and rays:\n• During drone filming do NOT SPREAD YOUR ARMS out — keep them close to your body.\n• Do NOT touch, grab or feed sharks, rays, turtles or fish.\n• Do not swim at the animals or chase them — move calmly.\n\n🌊 In the water:\n• Can’t swim or a weak swimmer — a life vest is mandatory, keep it on.\n• Stay with the group and within the guide’s sight, don’t swim far away.\n• Don’t stand on or touch corals — you can get cut and the reef dies.\n• Tired, cold or scared — raise your hand, the guide will help.\n\n☀️ Sun: sunscreen, a hat and water — sunburn is not a reason for a refund or rescheduling.\n\nOnce more: LISTEN TO THE GUIDE. It is your safety.',go:'exc',gl:'Excursions'},
{id:'swim',k:['can t swim','cannot swim','can not swim','not swim','bad swimmer','afraid','scared','safe','safety','danger','dangerous','bite','non swimmer','non-swimmer','weak swimmer'],a:'We provide life vests, masks and fins, and our team is always next to you — swimming with nurse sharks and rays is calm and safe, many guests do it for the first time. If you have doubts, message us and we will suggest the right option.\n\n⚠️ ALWAYS listen to the guide. Never swim near the boat propellers. Ask “safety rules” for the full list.',go:'mgr',gl:'Message a manager'},
 {id:'r_sunsiyam',k:['sun siyam','sunsiyam','olhuveli','olhuvelhi','included at sun siyam','included in sun siyam','what is included at sun siyam','what s included at sun siyam','at sun siyam','included at olhuveli','included in olhuveli','what is included at olhuveli','what s included at olhuveli','at olhuveli'],a:'🏝 Olhuveli Sun Siyam — resort day trip\n💵 $145 per person · kids 2–12 — $85 · under 2 — free\n🕘 09:00–17:00 · about 15 minutes by boat from Maafushi\n\nIncluded:\n• lunch — buffet\n• alcoholic and soft drinks, water — 10:00–16:30\n• sunbeds and towels\n• transfer both ways\n\nOn the island: three pools, four water-villa structures, a tennis court, an ocean-side SPA, three bars and two restaurants. Lots of swings, sofas and loungers — free to use.\n\nBook and pay no later than 21:00 the day before.',go:'res',gl:'Resorts'},
{id:'r_adaaran',k:['adaaran','ranhali','included at adaaran','included in adaaran','what is included at adaaran','what s included at adaaran','at adaaran','included at ranhali','included in ranhali','what is included at ranhali','what s included at ranhali','at ranhali'],a:'🏝 Adaaran Club Ranhali — resort day trip\n💵 $130 per person · kids 2–12 — $90 · under 2 — free\n🕘 09:00–17:00 · 15–20 minutes by boat from Maafushi\n\nIncluded:\n• unlimited alcoholic and soft drinks all day\n• lunch at the resort restaurant — buffet\n• tea/coffee and snacks (cakes, sandwiches) twice a day\n• unlimited Wi-Fi across the hotel\n• towel and sunbeds\n• transfer\n\nOn the island: small and cozy, 2 overwater bars, a restaurant, a cinema, a diving center, a SPA, famous water villas and a wonderful reef.\n\nBook and pay no later than 21:00 the day before.',go:'res',gl:'Resorts'},
{id:'r_fihal',k:['fihalhohi','included at fihalhohi','included in fihalhohi','what is included at fihalhohi','what s included at fihalhohi','at fihalhohi'],a:'🏝 Fihalhohi Island Resort — resort day trip\n💵 $130 per person · kids 2–12 — $90 · under 2 — free\n🕘 09:00–17:00 · 15–20 minutes by boat from Maafushi\n\nIncluded:\n• lunch on the island — buffet\n• Wi-Fi across the island\n• unlimited alcoholic and soft drinks — drinking only at the bar\n• transfer\n\nOn the island: beautiful water villas and the most beautiful reef — while swimming you can see stingrays, sharks, crabs and turtles.\n\nBook and pay no later than 21:00 the day before.',go:'res',gl:'Resorts'},
{id:'r_centara',k:['centara','ras fushi','included at centara','included in centara','what is included at centara','what s included at centara','at centara','included at ras fushi','included in ras fushi','what is included at ras fushi','what s included at ras fushi','at ras fushi'],a:'🏝 Centara Ras Fushi — resort day trip (adults only)\n💵 $160 per person\n⛔️ Children under 12 are NOT allowed.\n🕘 08:00–18:30 — the longest day of all resorts\n\nIncluded:\n• unlimited alcoholic and soft drinks\n• lunch — buffet at the resort restaurant\n• beach towel, sunbeds, pool\n\nOn the island: a small adults-only island, a pool area with a swim-up bar, tables with umbrellas right in the water, unlimited Wi-Fi.\n\nBook and pay for the transfer no later than 21:00 the day before.',go:'res',gl:'Resorts'},
{id:'r_cmp',k:['which resort','best resort','compare resorts','difference between resorts','best reef','alcohol included','unlimited drinks','swim-up bar','swim up bar','tennis','resort with pool','recommend a resort'],a:'How to choose a resort for the day:\n• Most beautiful reef, rays and sharks off the beach → Fihalhohi ($130)\n• Most facilities: 3 pools, tennis, SPA, 3 bars → Sun Siyam ($145)\n• Unlimited drinks all day, snacks, Wi-Fi, overwater bars → Adaaran ($130)\n• No kids, longest day 08:00–18:30, swim-up bar → Centara ($160, 12+ only)\n• With kids → Sun Siyam (kids $85), Adaaran or Fihalhohi (kids $90, under 2 free)\n• Alcohol is included at all four (Sun Siyam 10:00–16:30, Fihalhohi — at the bar only).\nAll resorts are 15–20 minutes by boat from Maafushi, book by 21:00 the day before.',go:'res',gl:'Resorts'},
{id:'res',k:['resort','day visit','day trip to resort','all inclusive','all-inclusive'],a:'Day visits to 5* resorts from Maafushi (usually 9:00–17:00, boat transfer, buffet lunch, drinks, beach):\n• Olhuveli Sun Siyam — $145, children 2–12 $85\n• Adaaran Club Ranhali — $130, children 2–12 $90, under 2 free\n• Fihalhohi Island — reef with rays and sharks, unlimited drinks\n• Centara Ras Fushi — $160, 12+ only, 8:00–18:30\nBook and pay by 21:00 the day before.',go:'res',gl:'Resorts'},
 {id:'hotels',k:['hotel','guesthouse','where to stay','accommodation','stay on','room','check in','check-in','kaani','arena','icom','palms','thoddoo','where should we stay','place to stay'],a:'Hotels on local islands via direct contracts, no middlemen:\n• Maafushi — Kaani Palm, Kaani Grand, Arena Beach, Icom Blue\n• Thoddoo — The Palms (quiet island, beaches and plantations)\n\nDeposit — 20% of the total (2000 RUB of it is non-refundable); the rest is paid in USD at check-in. Available dates and seasonal prices are on each hotel page.',go:'hot',gl:'Hotels'},
 {id:'lux',k:['luxury','villa','water villa','overwater','private island','stay at a resort','stay in a resort','premium','vip','honeymoon'],a:'Booking stays at premium resorts and private islands — concierge service together with BE IN MALDIVES. Every request is handled individually: we will find the island and villa, including options not available on Booking.',go:'mgr',gl:'Message a manager'},
 {id:'flight',k:['flight','flights','airfare','plane ticket','air ticket','airline','how to get to the maldives','how do we get there','get to maldives','cheap tickets','cheap flights','flight cost','ticket price'],a:'Flights are not included in the signature tour — you buy tickets to Malé (Velana airport) separately.\n\n✈️ Cheap tickets to the Maldives do come up, but you need to catch them yourself: watch for sales and book early. Any other tour questions — ask a manager.',go:'mgr',gl:'Message a manager'},
{id:'tour',k:['signature','author','group tour','tour','itinerary','islands','5 islands','7 islands','journey','people in the group','group size','how many people'],w:['how much','cost','price'],a:'Signature tour on Maafushi — from $1960:\n• 5–7 islands and the underwater world\n• photo and video shoot\n• groups of 8–12 people\n• comfortable stay, boat trips, the best spots\n\n✈️ Flights are not included — you buy tickets to Malé separately. Cheap tickets to the Maldives do come up, but you need to catch them yourself.\n\nDates 2026–2027: 01.11–08.11, 30.12–06.01 (New Year), 24.01–31.01, 13.02–20.02, 06.03–13.03, 20.03–27.03, 03.04–10.04, 28.04–05.05.',go:'tour',gl:'Book the tour'},
 {id:'ny',k:['new year','christmas','holidays'],a:'New Year in the Maldives — signature tour from 30.12 to 06.01.27. We recommend booking early: group places are limited (8–12 people). Flights are not included in the tour price.',go:'tour',gl:'Book'},
 {id:'dates',k:['date','dates','when is the tour','next tour','upcoming','available','schedule','which month','in january','in february','in march','in april','in november','in december','in may','tour dates','signature tour dates'],a:'Upcoming signature tour dates: 01.11–08.11, 30.12–06.01 (New Year), 24.01–31.01, 13.02–20.02, 06.03–13.03, 20.03–27.03, 03.04–10.04, 28.04–05.05.\nExcursions run almost every day — choose the date in your request.',go:'tour',gl:'Choose dates'},
 {id:'dive',k:['dive','diving','scuba','open water','advanced','padi','certificate','shark tank'],a:'Diving with an instructor — from $55:\n• Discover Scuba Diving — first dive for beginners, 2–3 hours\n• Shark Tank Dive — dive with sharks, for experienced divers\n• Single Dive — for certified divers (tanks, weights, guide, transfer included)\n• Open Water Diver — international certificate, down to 18 m, 3–4 days\n• Advanced Open Water — down to 30 m, 2–3 days\nPhotos and videos included.',go:'dive',gl:'Diving'},
 {id:'active',k:['parasail','jet ski','jetski','jet car','flyboard','surf','banana','kayak','sup','paddle','wakeboard','water ski','water sports','water activities','activities'],a:'Water activities on Maafushi: parasailing, jet skis and Jet Car, flyboard, wakeboarding and water skiing, banana and Fun Tube, kayaks and SUP, surfing, combo packages for two. We work with trusted local operators. Prices depend on season and weather — ask a manager.',go:'mgr',gl:'Ask for prices'},
 {id:'photo',k:['photoshoot','photo shoot','photographer','photo session','shooting','portfolio'],a:'Photoshoots in the Maldives:\n• At a resort — from $250: 2 hours (resort entry and photographer transfer extra)\n• On an uninhabited island or sandbank — from $200: 1.5 hours (transfer from $100)\n• Drone — +$100, drone only — $150\nAll originals the same day on your drive (32 GB+), 10 retouched and 30 color-graded photos within 2 weeks after you choose them.',go:'mgr',gl:'Book a shoot'},
 {id:'wed',k:['wedding','ceremony','bride','groom','engagement','marry','marriage','vow','proposal','propose','getting married','get married'],a:'Wedding ceremony on a local or uninhabited island — from $700:\n• photographer for 2 hours: all originals, 10 retouched, 30 color-graded photos\n• arch decoration, ceremony and certificate\n• bridal bouquet (rental, artificial flowers)\nThe ceremony is held in English by a Maldivian in national dress. Makeup and hair — extra (from Malé, from $150), video — from $150.',go:'mgr',gl:'Discuss a wedding'},
 {id:'terms',k:['booking terms','booking conditions','booking policy','terms','conditions','policy','agreement','cancellation and refund rules'],a:'ALGA excursion booking terms:\n\n💳 Payment\n• Prepayment — $10 per person per excursion: non-refundable, included in the price. Paid in RUB at the USD rate (Rosselkhozbank, purchase).\n• Balance: RUB card transfer (resorts — cash USD only), cash USD, or VISA / MasterCard / UnionPay at the office — 4% Bank of Maldives fee.\n• Full payment — no later than 2 days before the excursion, otherwise the booking may be considered cancelled by the client.\n\n🔁 Rescheduling — once, no later than 5 days before, subject to group and free spots.\n\n❌ Cancellation\n• You cancel 24+ hours before — refund minus prepayment; less than 24 hours — no refund.\n• The company cancels — 100% refund within 1 business day.\n• Excursions are group-based: the date depends on group formation and weather, so the company may change it.\n\n🤒 Illness — refund or rescheduling only with medical documents (one per participant). Sunburn and women’s critical days are not valid reasons.\n\n🕔 Office — daily 17:00–22:00, outside these hours message a manager.\n\nBy booking with ALGA TOURS, you agree to the booking and cancellation policy.',go:'mgr',gl:'Message a manager'},
{id:'full',k:['full payment','pay in full','pay the full','pay the rest','remaining amount','balance due','when do i pay the','how many days before pay'],a:'Full payment for an excursion is due no later than 2 days before the date. If it is not made, the company may consider the booking cancelled by the client.\nMethods: RUB card transfer (resorts — cash USD only), cash USD, or card at the office (4% fee).'},
{id:'ill',k:['ill','illness','sick','fever','medical','doctor','hospital','food poisoning','unwell','sunburn','sunburnt','period','critical days','medical certificate','medical document','if i get sick'],a:'If you get ill:\nIf you learn about an illness 24 hours before the excursion and decide to cancel, to request a refund or rescheduling you need to:\n1. Notify an ALGA manager in writing (messenger).\n2. Provide medical documents confirming contraindications for the excursion date — available at the hospital on Maafushi Island.\n3. A separate document is required for each participant.\n⚠️ Without medical documents the booking is considered cancelled with no refund or rescheduling.\n\n❗ Not valid reasons for a refund or rescheduling:\n• sunburn\n• women’s critical days\nGuests are responsible for considering the risks of the country of stay.',go:'mgr',gl:'Message a manager'},
{id:'datechg',k:['changed the date','change the excursion date','can you reschedule','why was it moved','group not formed','group-based','group based','not enough people'],a:'ALGA excursions are group-based: the date depends on group formation and weather. So the company reserves the right to change the excursion date if necessary.\nIf the company cancels — 100% refund within 1 business day.'},
{id:'hours',k:['office hours','opening hours','working hours','what time is the office','when is the office open','open until','open from'],a:'The ALGA office on Maafushi is open daily 17:00–22:00. Outside these hours message a manager on WhatsApp or Telegram — we are available 24/7.\nExcursion photos and videos can be picked up at the office the same day, 19:00–22:00.'},
{id:'prepay',k:['deposit','prepay','prepayment','advance payment','how to book','how do i book','booking','reserve'],a:'Deposit:\n• excursions — $10 per person per excursion (non-refundable, part of the price)\n• hotels — 20% of the total, 2000 RUB of it non-refundable\nThe deposit is paid in rubles at the USD rate (Rosselkhozbank). Excursions must be fully paid at least 2 days before, otherwise the booking may be cancelled.',go:'form',gl:'Send a request'},
 {id:'pay',k:['pay','payment','card','cash','dollar','usd','ruble','rub ','transfer','commission','fee','visa card','mastercard','unionpay'],a:'Paying the balance:\n• in rubles by bank transfer (except resorts — USD cash only)\n• USD cash at the office\n• VISA / MasterCard / UnionPay at the office, if your card works abroad — 4% Bank of Maldives fee\nThe deposit is paid in rubles at the USD rate (Rosselkhozbank).'},
 {id:'cancel',k:['cancel','cancellation','refund','money back','can t come','cannot come','weather is bad','bad weather','storm','changed our mind','change our mind','changed my mind','cancel booking','cancel my','cancel the'],a:'Excursion cancellation:\n• if you cancel 24+ hours before — refund minus the deposit\n• less than 24 hours before — no refund\n• if we cancel (e.g. due to weather) — 100% refund within 1 business day'},
 {id:'move',k:['reschedule','postpone','change the date','another date','move the date','change the day','another day','different day','move my','move the'],a:'An excursion can be moved to another date once — no later than 5 days before it, subject to group and availability.'},
 {id:'visa',k:['visa','passport','entry','immigration','border'],a:'Russian citizens do not need a visa: a free 30-day entry permit is stamped on arrival. Many other nationalities also get a free 30-day visa on arrival — please check the rules for your passport.'},
 {id:'contact',k:['contact','whatsapp','telegram','call','phone','write to','message you','manager','katya','ekaterina','reply','respond','reach you','get in touch'],a:'We are available 24/7 on WhatsApp and Telegram, average response time is about 15 minutes. Or send a request right in the app.',go:'mgr',gl:'Message on Telegram'},
 {id:'about',k:['who are you','about you','about the company','agency','alga','founder','experience','reliable','trust'],a:'ALGA is a travel agency in the Maldives. Founder Ekaterina has lived in the Maldives for over 10 years, creates signature tours, organizes excursions and personally looks after guests. Direct contracts with hotels, no middlemen, 24/7 support.'},
 {id:'why',k:['why you','why alga','why book with','cheaper','best price','discount','booking.com','choose you','better than booking','why should'],a:'Why ALGA: direct contracts with hotels without middlemen, best price guarantee and access to villas not listed on Booking. Available 24/7.'},
 {id:'island',k:['maafushi','local island','where are you','where is your','office','location','find you','pier','jetty'],a:'We are based on Maafushi island — excursions and resort trips start from the Maafushi pier, and our office is there too (photos from excursions, cash or card payments).'},
 {id:'pg_how',k:['how to use the presets','how to use presets','how do i use','how to apply','instructions','guide','how to use luts','how do i use them','how to use them','how they work','don t know how'],a:'How to use the presets — in short:\n1. Install them in Lightroom (phone — DNG files, computer — XMP).\n2. Open a photo and pick a preset — it is a starting point, not the final look.\n3. Fine-tune for the shot: exposure → white balance → highlights & shadows → colour.\n4. Too strong? Lower the preset Amount.\n5. For a series: finish one photo, copy the settings to the rest, then adjust exposure on each.\nAsk “how to install on my phone” or “what to adjust after the preset” for details.',go:'pre',gl:'Presets'},
{id:'pg_mob',k:['install','installing','how to install','lightroom mobile','create preset','add presets','import presets'],a:'Installing in Lightroom Mobile (iPhone & Android), DNG files:\n1. Save the DNG files to your phone (unzip if needed).\n2. In Lightroom tap “Add photos” and import the DNGs like normal photos.\n3. Open the first DNG → “⋯” (top right) → “Create Preset”.\n4. Name it, choose a group (e.g. “User Presets”) → ✓.\n5. Repeat for each DNG.\nDone: on any photo — “Presets” tab → your group → pick a preset.\nTip: you can delete the DNGs afterwards — the presets stay.',go:'pre',gl:'Presets'},
{id:'pg_pc',k:['on my computer','on computer','lightroom classic','on mac','on windows','laptop'],a:'Installing in Lightroom Classic (macOS & Windows), XMP files:\n1. Unzip the archive.\n2. Open the Develop module.\n3. Presets panel on the left → “+” → “Import Presets”.\n4. Select the XMP files (or the .zip) → “Import”.\nHover a preset to preview, click to apply.\nIn cloud Lightroom (not Classic): Edit → Presets → “⋯” → Import Presets.',go:'pre',gl:'Presets'},
{id:'pg_lut',k:['install lut','install luts','lut in davinci','lut in premiere','apply lut','apply the lut','use luts'],a:'Video LUTs (.cube files):\n• DaVinci Resolve: Project Settings → Color Management → “Open LUT Folder”, copy the .cube files → “Update Lists”. Then on the Color page: right-click a node → LUTs → pick one.\n• Premiere Pro: Lumetri Color → Creative → Look → “Browse…” → choose the .cube.\n• VN and other mobile editors: import the LUT (.cube) in the filters section, then apply to the clip.\nImportant: fix the clip’s exposure and white balance first, then add the LUT. Too strong? Lower the LUT intensity/opacity.',go:'pre',gl:'Presets'},
{id:'pg_tune',k:['what to adjust','what should i adjust','fine tune','fine-tune','after the preset','after applying','doesn t look like','not like the example','which sliders','how to tweak','tweak'],a:'What to adjust after the preset — in order (every photo has different light, so a preset never looks identical without fine-tuning):\n1. Exposure — the face or main subject should read well. Usually ±0.3–1.\n2. White balance: Temp — warmer/cooler, Tint — remove green or magenta. This is the main difference between shots.\n3. Highlights down if the sky or white clothes are blown; Shadows up if details are lost.\n4. Whites slightly up, Blacks slightly down for contrast.\n5. Vibrance/Saturation down if colours are too loud.\n6. Colour (HSL): orange — skin, blue & aqua — sky and water, green — foliage.\n7. Preset Amount — 60–100% to taste.\n8. Night/dark shots — add noise reduction.\nRule: small moves, and compare with the original (long-press the photo).',go:'pre',gl:'Presets'},
{id:'pg_skin',k:['skin','skin tone','orange skin','yellow skin','red skin','face looks orange'],a:'Skin after a preset:\n• Too orange/yellow → Colour (HSL) → Orange: saturation −5…−15, luminance +5…+10.\n• Too red → Red: saturation −5…−10, hue slightly toward orange.\n• Grey or pale → Orange saturation +5, Temp slightly warmer.\n• Greenish (light from foliage) → Tint slightly right, toward magenta.\n• Too harsh → Texture −5…−10, Clarity down.\nKeep it natural — compare with the original.',go:'pre',gl:'Presets'},
{id:'pg_fix',k:['too dark','blown','overexposed','too yellow','too blue','green cast','too bright','too saturated','dull','noise','noisy','ruined','looks bad'],a:'Common problems and fixes:\n• Too dark → Exposure up, Shadows up.\n• Blown sky → Highlights down, Whites down.\n• Everything yellow/orange → Temp cooler.\n• Everything blue → Temp warmer.\n• Green cast → Tint right (toward magenta).\n• Too bright and “acid” → Vibrance/Saturation down or preset Amount 60–80%.\n• Flat and dull → a bit more Contrast or Blacks down.\n• Noise on night photos → Detail → Noise Reduction +20…40.\nPresets work best on RAW with normal exposure; JPEGs and very dark shots need more tweaking.',go:'pre',gl:'Presets'},
{id:'pg_batch',k:['series','many photos','all photos','copy settings','paste settings','sync','batch','same look'],a:'Editing a series consistently:\n• Lightroom Mobile: finish one photo → “⋯” → “Copy Settings” → select the others → “Paste Settings”.\n• Lightroom Classic: finish a photo → select the series → “Sync” (Ctrl/Cmd+Shift+S), choose what to copy.\nThen go through each shot and adjust exposure and temperature — light always differs a little.',go:'pre',gl:'Presets'},
{id:'pg_amt',k:['strength','intensity','amount slider','too strong','weaker','reduce the effect','tone it down'],a:'Preset strength:\n• In Lightroom (Mobile and cloud) there is an “Amount” slider under the selected preset — 0 to 200%. For a soft look use 60–80%.\n• Older Lightroom Classic versions have no such slider — reduce saturation, contrast and Clarity manually.\n• For video LUTs — lower the LUT intensity/opacity in your editor.',go:'pre',gl:'Presets'},
{id:'pg_sea',k:['underwater','sea color','sea colour','water color','water colour','turquoise','beach photos','sky color','sky colour','ocean'],a:'Sea, sky and underwater shots (Maldives presets):\n• Turquoise water: Colour (HSL) → Aqua — hue and saturation to taste; Blue — sky.\n• Blown sky → Highlights down, or a Sky mask with slightly lower exposure.\n• Underwater: use Maldives 05 (underwater), then warmer Temp and Dehaze +10…+30 — water makes everything blue and hazy.\n• Bright sun and white sand: Whites and Highlights down to keep detail.\n• Skin on the beach often turns too orange — lower orange saturation.',go:'pre',gl:'Presets'},
{id:'presets',k:['preset','lut','lightroom','color grading','colour grading','what are presets','why presets','maldives colors','maldives colours'],a:'Maldives Presets — signature settings by photographer Anton Avanzato: the colours of the Maldives for your photos and videos in a couple of taps. They bring out details, boost the right tones and remove unwanted colours — a pro result in a few clicks.\n\n• 5 photo presets + 5 video LUTs\n• Lightroom Mobile & Classic, DaVinci, Premiere, VN, Liit\n• price — $40',go:'pre',gl:'Presets'},
{id:'pre_diff',k:['presets vs lut','preset and lut','difference between preset','what is a lut','what are luts'],a:'Presets are photo settings for Lightroom. LUTs are colour tables for video: DaVinci Resolve, Premiere, VN.\nSimply: presets for photos, LUTs for video. The Maldives pack has both: 5 + 5.',go:'pre',gl:'Presets'},
{id:'pre_any',k:['any photo','fit any','work on any','raw','jpeg','jpg','phone photos'],a:'Presets work best on RAW with normal exposure. Sometimes a small exposure or white balance tweak is all you need.',go:'pre',gl:'Presets'},
{id:'pre_skill',k:['need skills','skills','is it hard','difficult to use','i am a beginner','presets for beginners'],a:'No skills needed — presets apply in one tap, even if you are just starting out.',go:'pre',gl:'Presets'},
{id:'pre_comm',k:['resell','share the files','commercial use','for clients','commercial'],a:'You can use the presets commercially: client shoots, social media, ads, YouTube. Reselling or sharing the files is not allowed.',go:'pre',gl:'Presets'},
{id:'pre_fmt',k:['presets for phone','for my phone','format','dng','xmp','cube','android','iphone','ios','davinci','premiere','vn ','liit','which app'],a:'Formats and compatibility:\n• Lightroom Mobile (iOS & Android) — DNG files\n• Lightroom Classic (macOS & Windows) — XMP files\n• DaVinci Resolve / Premiere — .cube LUTs\n• mobile video editors VN and Liit',go:'pre',gl:'Presets'},

function ruDigits(v){v=String(v).trim();let d=v.startsWith('+7')?v.slice(2).replace(/\D/g,''):v.replace(/\D/g,'');if(!v.startsWith('+7')&&d.length>10)d=d.slice(d.length-10);while(/^[78]/.test(d))d=d.slice(1);return d.slice(0,10)}

function openExc(i){const c=((D&&D[L].excursions)||[])[i];if(!c)return;const X=XD[xSlug(c)],x=X&&X[L];if(!x){openUrl(c.url);return}

/* Жесты в просмотре фото: влево/вправо — листать, вниз — закрыть (фото тянется за пальцем, фон бледнеет) */
function zSwipe(w,len,step){let x0=null,y0=0,dx=0,dy=0,lock=0;const im=()=>w.querySelector('img');
  w.addEventListener('touchstart',(e)=>{e.stopPropagation();if(e.touches.length!==1)return;x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=dy=0;lock=0;const i=im();if(i)i.style.transition='none';w.style.transition='none'},{passive:true});
  w.addEventListener('touchmove',(e)=>{if(x0===null)return;dx=e.touches[0].clientX-x0;dy=e.touches[0].clientY-y0;
    if(!lock&&(Math.abs(dx)>8||Math.abs(dy)>8))lock=Math.abs(dy)>Math.abs(dx)?2:1;
    if(lock===2){e.preventDefault();const d=Math.max(0,dy),i=im();if(i)i.style.transform=`translateY(${d}px) scale(${1-Math.min(d,400)/2000})`;w.style.backgroundColor=`rgba(0,0,0,${.92*(1-Math.min(d,300)/400)})`}},{passive:false});
  w.addEventListener('touchend',(e)=>{if(x0===null)return;x0=null;const i=im();
    if(lock===2){e.preventDefault();if(dy>90){hap();if(i){i.style.transition='transform .2s ease,opacity .2s';i.style.transform=`translateY(${innerHeight}px)`;i.style.opacity='0'}w.style.transition='opacity .2s';w.style.opacity='0';setTimeout(()=>w.remove(),200)}
      else{if(i){i.style.transition='transform .2s ease';i.style.transform=''}w.style.transition='background-color .2s';w.style.backgroundColor=''}return}
    if(lock===1&&Math.abs(dx)>50&&len>1){e.preventDefault();step(dx<0?1:-1)}})}
function xZoom(i,k){const g=XD[xSlug(D[L].excursions[i])].gal;let n=k;const w=document.createElement('div');w.className='xz';
  const draw=()=>{w.innerHTML=`<img src="${esc(g[n][1])}" alt=""><span class="xzc">${n+1} / ${g.length}</span><button class="xzx" aria-label="close">×</button>`};draw();
  zSwipe(w,g.length,(d)=>{n=(n+d+g.length)%g.length;draw()});

function openHotel(i){const c=((D&&D[L].hotels)||[])[i];if(!c)return;const H=HD[xSlug(c)];if(!H){openUrl(c.url);return}

/* Сезон отеля → даты в форме: «November 1 – December 20, 2026» → 2026-11-01 … 2026-12-20 */
function hRange(t){const M={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  const m=String(t).toLowerCase().match(/([a-z]{3})[a-z]*\.?\s+(\d{1,2})\D+?([a-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(20\d\d)/);if(!m||!M[m[1]]||!M[m[3]])return null;
  const y2=+m[5],y1=M[m[1]]>M[m[3]]?y2-1:y2,p=(x)=>String(x).padStart(2,'0');
  return [y1+'-'+p(M[m[1]])+'-'+p(m[2]),y2+'-'+p(M[m[3]])+'-'+p(m[4])]}
function hBook(i){const H=HD[xSlug(D[L].hotels[i])],r=H&&H.seasons[hCur]&&hRange(H.seasons[hCur].en);
  if(!r){openForm('hotel',i);return}const add=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
  const tom=add(todayL(),1);if(r[1]<=tom){openForm('hotel',i);return}
  const ci=r[0]>tom?r[0]:tom,co=add(ci,7)<r[1]?add(ci,7):r[1];
  openForm('hotel',i,ci,co)}
function hSeason(i,k,el){hCur=k;document.querySelectorAll('.hs .chip').forEach((c)=>c.classList.toggle('on',c===el));$('hpr').src=HD[xSlug(D[L].hotels[i])].seasons[k].img;hap()}
/* Увеличение: таблица цен текущего сезона или фото галереи */
function hZoom(i,k){const H=HD[xSlug(D[L].hotels[i])];const g=k==null?H.seasons.map((s)=>s.img):H.gal;let n=k==null?hCur:k;const w=document.createElement('div');w.className='xz';
  const draw=()=>{w.innerHTML=`<img src="${esc(g[n])}" alt="">${g.length>1?`<span class="xzc">${n+1} / ${g.length}</span>`:''}<button class="xzx" aria-label="close">×</button>`};draw();
  zSwipe(w,g.length,(d)=>{n=(n+d+g.length)%g.length;draw()});
  w.onclick=(e)=>{if(e.target.tagName!=='IMG'||g.length<2){w.remove();return}n=(n+1)%g.length;draw()};
