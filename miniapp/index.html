/* RU: строго +7 (XXX) XXX-XX-XX, 8 и 7 в начале превращаются в +7. EN: любой международный номер с +, 7–15 цифр */
function ruDigits(v){v=String(v).trim();let d=v.startsWith('+7')?v.slice(2).replace(/\D/g,''):v.replace(/\D/g,'');if(!v.startsWith('+7')&&d.length>10)d=d.slice(d.length-10);while(/^[78]/.test(d))d=d.slice(1);return d.slice(0,10)}
function ruMask(d){let r='+7';if(d.length)r+=' ('+d.slice(0,3);if(d.length>3)r+=') '+d.slice(3,6);if(d.length>6)r+='-'+d.slice(6,8);if(d.length>8)r+='-'+d.slice(8,10);return r}
function phoneInput(el,ev){if(L==='ru'){if(ev&&ev.inputType&&ev.inputType.startsWith('delete'))return;el.value=ruMask(ruDigits(el.value))}else{let d=el.value.replace(/[^\d]/g,'').slice(0,15);el.value='+'+d}}
function phoneOk(v){return L==='ru'?ruDigits(v).length===10:/^\+\d{7,15}$/.test(v.replace(/[\s()-]/g,''))}
function phoneFmt(v){return L==='ru'?ruMask(ruDigits(v)):'+'+v.replace(/\D/g,'')}
const DATEF={excursion:'excursion_date',hotel:'check_in_date',resort:'resort_date',author:'author_date_start',diving:'diving_date'};
async function send(ev){ev.preventDefault();const f=$('f'),err=$('err'),b=$('sb');err.textContent='';
  const fd=new FormData(f);
  if(!fd.get(DATEF[KIND])){err.textContent=T.eDate;return false}
  if(!String(fd.get('fio')).trim()){err.textContent=T.eName;return false}
  if(!phoneOk(String(fd.get('phone')))){err.textContent=T.ePhone;return false}
  if(!$('agree').checked){err.textContent=T.agreeErr;return false}
  if(fd.get('departure_island')==='other')fd.set('departure_island',String(fd.get('isl_other')).trim()||'other');
  fd.delete('isl_other');fd.set('phone',phoneFmt(String(fd.get('phone'))));fd.set('service_type',KIND);fd.set('key',KEY);
  const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
  if(u&&u.username)fd.set('important_notes',(String(fd.get('important_notes')||'')+`\nTelegram: @${u.username}`).trim());
  b.disabled=true;b.textContent=T.sending;
  try{const ac=new AbortController(),to=setTimeout(()=>ac.abort(),20000);const r=await fetch(ENDPOINT,{method:'POST',body:new URLSearchParams(fd),signal:ac.signal}).finally(()=>clearTimeout(to));if(!r.ok)throw 0;
    formClear(KIND);$('done').innerHTML=`<div class="hero"><h1><span class="okic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>${T.ok}</h1><p>${T.okS}</p></div><button class="btn f" onclick="try{tg.close()}catch(e){show('home')}">${T.close}</button>${contacts()}`;show('done');
    try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}}

  let x0=null;w.addEventListener('touchstart',(e)=>{e.stopPropagation();x0=e.touches[0].clientX},{passive:true});

const DV={ru:{title:'Дайвинг на Мальдивах',lede:'Независимо от вашего опыта — от первого знакомства с подводным миром до профессионального уровня — мы подберём программу, которая подарит вам незабываемые впечатления от дайвинга на Мальдивах.',why:'Почему выбирают нас',
 p:[['Discover Scuba Diving','2–3 часа','Ознакомительная программа для тех, кто никогда раньше не занимался дайвингом и хочет попробовать себя под водой в сопровождении профессионального инструктора. Перед погружением — краткий инструктаж, знакомство со снаряжением и основные навыки безопасности. Затем первое настоящее погружение в океан среди коралловых рифов и тропических рыб.',[['Подходит для',['Полных новичков','Отдыхающих без опыта дайвинга','Тех, кто хочет попробовать дайвинг перед обучением']]]],
  ['Shark Tank Dive','','Одно из самых захватывающих приключений на Мальдивах. Во время погружения вы сможете наблюдать за акулами в безопасных условиях под контролем опытных инструкторов — увидеть морских хищников вблизи и испытать невероятные эмоции.',[['Что вас ждёт',['Инструктаж по безопасности','Сопровождение дайв-мастера','Незабываемые подводные впечатления']]],'Рекомендуется для дайверов с опытом погружений.'],
  ['Single Dive (Certified)','','Разовое погружение для сертифицированных дайверов. Присоединяйтесь к ежедневным погружениям на лучших дайв-сайтах Мальдив: коралловые сады, затонувшие объекты, места обитания морских черепах, скатов манта и другие удивительные локации.',[['В стоимость входит',['Баллоны и грузы','Сопровождение гида','Трансфер к месту погружения']]],'Требование: наличие действующего сертификата дайвера.'],
