function edgeBack(can,cur,go){var sx=0,sy=0,act=false,lock=0,el=null,dx=0;
  function reset(anim){if(!el)return;var e=el;e.style.transition=anim?'transform .22s cubic-bezier(.2,.8,.2,1)':'';e.style.transform='';if(anim)setTimeout(function(){e.style.transition=''},240)}
  document.addEventListener('touchstart',function(e){act=false;if(e.touches.length!==1)return;var t=e.touches[0];if(t.clientX>28||!can())return;sx=t.clientX;sy=t.clientY;dx=0;lock=0;el=cur();act=!!el},{passive:true});
  document.addEventListener('touchmove',function(e){if(!act)return;var t=e.touches[0];dx=t.clientX-sx;var dy=t.clientY-sy;
    if(!lock&&(Math.abs(dx)>10||Math.abs(dy)>10)){lock=dx>Math.abs(dy)*1.3?1:-1;if(lock===1){el.classList.remove('enter');el.style.transition='none'}}
    if(lock===1)el.style.transform='translateX('+Math.max(0,Math.min(dx,innerWidth))*.35+'px)'},{passive:true});
  function end(){if(!act)return;act=false;if(lock!==1)return;var ok=dx>80;reset(true);if(ok){try{tg.HapticFeedback.impactOccurred('light')}catch(_){}go()}}
  document.addEventListener('touchend',end,{passive:true});document.addEventListener('touchcancel',function(){if(act&&lock===1)reset(true);act=false},{passive:true})}

/* RU: строго +7 (XXX) XXX-XX-XX, 8 и 7 в начале превращаются в +7. EN: любой международный номер с +, 7–15 цифр */
function ruDigits(v){v=String(v).trim();let d=v.startsWith('+7')?v.slice(2).replace(/\D/g,''):v.replace(/\D/g,'');if(!v.startsWith('+7')&&d.length>10)d=d.slice(d.length-10);while(/^[78]/.test(d))d=d.slice(1);return d.slice(0,10)}
function ruMask(d){let r='+7';if(d.length)r+=' ('+d.slice(0,3);if(d.length>3)r+=') '+d.slice(3,6);if(d.length>6)r+='-'+d.slice(6,8);if(d.length>8)r+='-'+d.slice(8,10);return r}
function phoneInput(el,ev){if(L==='ru'){if(ev&&ev.inputType&&ev.inputType.startsWith('delete'))return;el.value=ruMask(ruDigits(el.value))}else{let d=el.value.replace(/[^\d]/g,'').slice(0,15);el.value='+'+d}}
function phoneOk(v){return L==='ru'?ruDigits(v).length===10:/^\+\d{7,15}$/.test(v.replace(/[\s()-]/g,''))}
function phoneFmt(v){return L==='ru'?ruMask(ruDigits(v)):'+'+v.replace(/\D/g,'')}
const DATEF={excursion:'excursion_date',hotel:'check_in_date',resort:'resort_date',author:'author_date_start',diving:'diving_date'};
async function send(ev){ev.preventDefault();const f=$('f'),err=$('err'),b=$('sb');err.textContent='';
  const fd=new FormData(f);
  if(!fd.get(DATEF[KIND])){err.textContent=T.eDate;return false}
  if(!String(fd.get('fio')).trim()){err.textContent=T.eName;return false}
  if(!phoneOk(String(fd.get('phone')))){err.textContent=T.ePhone;return false}
  if(!$('agree').checked){err.textContent=T.agreeErr;return false}
  if(fd.get('departure_island')==='other')fd.set('departure_island',String(fd.get('isl_other')).trim()||'other');
  fd.delete('isl_other');fd.set('phone',phoneFmt(String(fd.get('phone'))));fd.set('service_type',KIND);fd.set('key',KEY);
  const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
  if(u&&u.username)fd.set('important_notes',(String(fd.get('important_notes')||'')+`\nTelegram: @${u.username}`).trim());
  b.disabled=true;b.textContent=T.sending;
  try{const r=await fetch(ENDPOINT,{method:'POST',body:new URLSearchParams(fd)});if(!r.ok)throw 0;
    $('done').innerHTML=`<div class="hero"><h1><span class="okic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>${T.ok}</h1><p>${T.okS}</p></div><button class="btn f" onclick="try{tg.close()}catch(e){show('home')}">${T.close}</button>${contacts()}`;show('done');
    try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}}
