 {id:'priv',k:['приват','индивидуальн','свою компани','только для нас','отдельный катер','персональн','частн','только наша','только мы','наша семья на катере','своей семьей','свой катер','без группы','без чужих'],a:'Приватные экскурсии — катер только для вашей компании (до 18 человек):\n• Акулы и коса — $2000\n• Китовая акула — $2500\n• Аквариум — $1800\n• Half Day — $1000\nМожно собрать и индивидуальный маршрут — напишите даты и пожелания.',go:'form',gl:'Оставить заявку'},

 {id:'safety',k:['правила безопасн','техника безопасн','безопасность на экскурс','правила поведен','правила на экскурс','что нельзя','нельзя делать','чего нельзя','винт','у катера','около катера','руки на дрон','раскидывать рук','расставлять рук','трогать акул','трогать скат','трогать черепах','можно трогать','можно потрогать','кормить','покормить','коралл','слушать гида','инструктаж'],a:'⚠️ ПРАВИЛА БЕЗОПАСНОСТИ — ОБЯЗАТЕЛЬНО ДЛЯ ВСЕХ ⚠️\n\n‼️ ВСЕГДА СЛУШАЙТЕ ГИДА. ВСЕГДА. Без исключений. Гид знает море, течения и животных — его слово главное.\n\n🚤 Катер:\n• НЕ подплывайте к винтам и к корме катера — это смертельно опасно.\n• Не прыгайте в воду и не забирайтесь на катер без команды гида.\n• Пока катер движется или заводит мотор — все остаются на борту.\n\n🦈 Акулы и скаты:\n• Во время съёмки с дрона НЕ РАСКИДЫВАЙТЕ РУКИ в стороны — держите их ближе к телу.\n• НЕ трогайте, не хватайте и не кормите акул, скатов, черепах и рыб.\n• Не плывите на животных и не гоняйтесь за ними — двигайтесь спокойно.\n\n🌊 В воде:\n• Не умеете плавать или плаваете плохо — жилет обязательно, не снимайте его.\n• Держитесь группы и в зоне видимости гида, не уплывайте далеко.\n• Не вставайте на кораллы и не трогайте их — можно порезаться, а рифы погибают.\n• Почувствовали усталость, холод или страх — поднимите руку, гид поможет.\n\n☀️ Солнце: солнцезащитный крем, головной убор и вода — солнечный ожог не причина для возврата или переноса экскурсии.\n\nЕщё раз: СЛУШАЙТЕ ГИДА. Это ваша безопасность.',go:'exc',gl:'Экскурсии'},
{id:'swim',k:['не умею плават','плохо плава','не плаваю','боюсь','страшно','безопасн','опасн','кусают','кусаются','нападают','не умеет плават','ребенок не умеет'],a:'На экскурсиях выдаём жилеты, маски и ласты, рядом всегда наши ребята — плавать с акулами-няньками и скатами спокойно и безопасно, многие гости решаются впервые. Если есть сомнения — напишите, подберём формат.\n\n⚠️ ВСЕГДА слушайте гида. Не подплывайте к винтам катера. Спросите «правила безопасности» — расскажу всё.',go:'mgr',gl:'Написать менеджеру'},
 {id:'r_sunsiyam',k:['sun siyam','sunsiyam','сан сиям','сансиям','olhuveli','olhuvelhi','олхувели','ольхувели'],a:'🏝 Olhuveli Sun Siyam — день на резорте\n💵 $145 с человека · дети 2–12 лет — $85 · до 2 лет — бесплатно\n🕘 с 09:00 до 17:00 · около 15 минут на катере от Маафуши\n\nВключено:\n• обед — шведский стол\n• алкогольные и безалкогольные напитки, вода — с 10:00 до 16:30\n• лежаки и полотенце\n• трансфер туда и обратно\n\nНа острове: три бассейна, четыре комплекса водных вилл, теннисный корт, СПА на берегу океана, три бара и два ресторана. Много качелей, диванов и лежаков — бесплатно.\n\nЗабронировать и оплатить — не позже 21:00 накануне.',go:'res',gl:'Резорты'},
{id:'r_adaaran',k:['adaaran','адаран','ranhali','ранхали'],a:'🏝 Adaaran Club Ranhali — день на резорте\n💵 $130 с человека · дети 2–12 лет — $90 · до 2 лет — бесплатно\n🕘 с 09:00 до 17:00 · 15–20 минут на катере от Маафуши\n\nВключено:\n• безлимитные алкогольные и безалкогольные напитки весь день\n• обед в ресторане резорта — шведский стол\n• 2 раза в день чай/кофе и закуски (кексы, сэндвичи)\n• безлимитный Wi-Fi по всему отелю\n• полотенце и лежаки\n• трансфер\n\nНа острове: небольшой и уютный, 2 бара на воде, ресторан, кинотеатр, дайвинг-центр, SPA, знаменитые виллы на воде и замечательный риф.\n\nЗабронировать и оплатить — не позже 21:00 накануне.',go:'res',gl:'Резорты'},
{id:'r_fihal',k:['fihalhohi','фихалхохи','фихал'],a:'🏝 Fihalhohi Island Resort — день на резорте\n💵 $130 с человека · дети 2–12 лет — $90 · до 2 лет — бесплатно\n🕘 с 09:00 до 17:00 · 15–20 минут на катере от Маафуши\n\nВключено:\n• обед на острове — шведский стол\n• Wi-Fi по всему острову\n• безлимитные алкогольные и безалкогольные напитки — распивать можно только на территории бара\n• трансфер\n\nНа острове: очень красивые водные виллы и самый красивый риф — купаясь, можно увидеть скатов, акул, крабов и черепах.\n\nЗабронировать и оплатить — не позже 21:00 накануне.',go:'res',gl:'Резорты'},
{id:'r_centara',k:['centara','сентар','центар','ras fushi','рас фуши'],a:'🏝 Centara Ras Fushi — день на резорте (только взрослые)\n💵 $160 с человека\n⛔️ Только гости от 18 лет — с детьми посещать НЕЛЬЗЯ.\n🕘 с 08:00 до 18:30 — самый длинный день из всех резортов\n\nВключено:\n• безлимитные алкогольные и безалкогольные напитки\n• обед — шведский стол в ресторане резорта\n• пляжное полотенце, лежаки, бассейн\n\nНа острове: небольшой остров для отдыха без детей, зона с бассейном и баром прямо в бассейне, столики с зонтиками прямо в воде, безлимитный Wi-Fi.\n\nЗабронировать и оплатить трансфер — не позже 21:00 накануне.',go:'res',gl:'Резорты'},
{id:'r_cmp',k:['какой резорт выбрать','какой резорт лучше','какой лучше резорт','сравни резорт','сравнить резорт','чем отличаются резорт','разница между резорт','на каком резорте','где лучший риф','лучший риф','где алкоголь','алкоголь включ','безлимит','бар в бассейне','теннис','бассейн на резорт','какой резорт посоветуете','посоветуйте резорт','подобрать резорт','подобрать мне резорт','выбрать резорт','помогите выбрать резорт','резорт для фото','лучший резорт','красивый пляж'],a:'Как выбрать резорт на день:\n• Самый красивый риф, скаты и акулы у берега → Fihalhohi ($130)\n• Больше всего инфраструктуры: 3 бассейна, теннис, СПА, 3 бара → Sun Siyam ($145)\n• Безлимит весь день, закуски, Wi-Fi, бары на воде → Adaaran ($130)\n• Без детей, самый длинный день 08:00–18:30, бар в бассейне → Centara ($160, только с 18 лет)\n• С детьми → Sun Siyam (дети $85), Adaaran или Fihalhohi (дети $90, до 2 лет бесплатно)\n• Алкоголь включён на всех четырёх (на Sun Siyam — с 10:00 до 16:30, на Fihalhohi — только в баре).\nВсе резорты — 15–20 минут на катере от Маафуши, бронь до 21:00 накануне.',go:'res',gl:'Резорты'},

 {id:'hotels',k:['отел','гостиниц','где жить','где остановит','проживан','номер','заселен','гестхаус','отели на','жилье','жилья','пожить на маафуши'],a:'Отели на локальных островах по прямым контрактам, без посредников:\n• Маафуши — Kaani Palm, Kaani Grand, Arena Beach, Icom Blue\n• Тодду — The Palms (тихий остров, пляжи и плантации)\n\nПредоплата — 20% от стоимости (2000 ₽ из неё невозвратные), в рублях по курсу; остальное — в долларах при заселении. Свободные даты и цены на сезон — на странице отеля.',go:'hot',gl:'Отели'},

{id:'tour',k:['авторск','тур ','тура','туре','туру','туров','туром','маршрут','групп','5 остров','7 остров','путешеств','тур на неделю'],w:['сколько','стоит','цен'],a:'Авторский тур на Маафуши — от $1960:\n• 5–7 островов и подводный мир\n• фото- и видеосъёмка\n• группы 8–12 человек\n• комфортное размещение, морские прогулки, лучшие локации\n\n✈️ Перелёт в стоимость не входит — билеты до Мале покупаете отдельно. Бывают недорогие билеты на Мальдивы, но их нужно ловить отдельно.\n\nДаты 2026–2027: 01.11–08.11, 30.12–06.01 (Новый год), 24.01–31.01, 13.02–20.02, 06.03–13.03, 20.03–27.03, 03.04–10.04, 28.04–05.05.',go:'tour',gl:'Забронировать тур'},

 {id:'weather',k:['погод','какая погода','как погода','погода на мальдив','какая там погода','климат','погода там'],a:'☀️ На Мальдивах солнечно круглый год, и температура почти не меняется:\n• днём — около +30…31 °C\n• вечером и ночью — около +26…27 °C\n• вода — +27…29 °C\n\nДожди бывают, но короткие — обычно около часа, потом снова солнце.\n\nСпросите про любой месяц — например, «погода в марте».',go:'exc',gl:'Экскурсии'},
{id:'w_best',k:['когда лучше','лучше ехать','лучше поехать','лучше лететь','лучшее время','лучший сезон','какой сезон','высокий сезон','низкий сезон','когда сезон','в какой месяц лучше','какой месяц лучше','когда ехать','когда поехать','когда лететь','в какое время ехать','туристов','много людей','много туристов','сезон дождей'],a:'Ехать можно круглый год — солнце и тепло на Мальдивах всегда.\n• Декабрь–апрель — самый сухой и солнечный период, спокойное море и отличная видимость под водой. Это высокий сезон: туристов больше, места лучше бронировать заранее.\n• Май–ноябрь — тоже тепло и солнечно, бывают короткие дожди и чуть больше ветра, зато туристов меньше.\n• На Новый год — самый спрос, бронируйте как можно раньше.\n\nСпросите про любой месяц — например, «погода в марте».',go:'exc',gl:'Экскурсии'},
{id:'w_rain',k:['дожд','ливн','дождлив','сезон дожд','муссон','гроз','пасмурн','облачн','тучи','зонт'],a:'🌦 Дожди на Мальдивах бывают, но обычно короткие — около часа, тёплые, и потом снова солнце. Целыми днями не льёт.\nМеньше всего дождей — с декабря по апрель. С мая по ноябрь короткие ливни случаются чаще, но солнца всё равно много.\n⚠️ Прогнозу в приложениях не верьте: там часто «дождь» на каждый день, а по факту — солнце и короткий тёплый ливень.',go:'exc',gl:'Экскурсии'},
{id:'w_app',k:['прогноз','в приложении дожд','показывает дожд','пишет дожд','обещают дожд','в интернете дожд','синоптик'],a:'Прогнозы погоды для Мальдив почти всегда «пугают»: значок дождя стоит чуть ли не каждый день. На деле это обычно короткий тёплый ливень минут на 40–60, а остальное время — солнце. Поэтому на прогноз в телефоне не ориентируйтесь.\nЕсли море будет неспокойным, гид сам скажет и при необходимости перенесёт выезд ради вашей безопасности.',go:'exc',gl:'Экскурсии'},

 {id:'photo',k:['фотосесс','фотограф','фотосъем','съемк','снимок','портфолио','на пляже','снимете нас','сфотографир'],a:'Фотосессии на Мальдивах:\n• На резорте — от $250: 2 часа съёмки (входной билет и трансфер фотографа отдельно)\n• На необитаемом острове или косе — от $200: 1,5 часа (трансфер от $100)\n• Дрон — +$100, только дрон — $150\nВсе исходники отдаём в тот же день на ваш носитель (от 32 ГБ), 10 фото в ретуши и 30 в цветокоррекции — в течение 2 недель после отбора.',go:'mgr',gl:'Заказать съёмку'},
 {id:'wed',k:['свадьб','церемон','жених','невест','помолвк','обручен','брак','предложение руки','предложение','сделать предложение','визаж','макияж','прическ','пожениться','поженит','расписаться','свадебн','свадьба на','свадьбу на','свадьбы на'],a:'Свадебная церемония на локальном или необитаемом острове — от $700:\n• фотограф 2 часа: все исходники, 10 фото в ретуши, 30 в цветокоррекции\n• оформление арки, церемония и сертификат\n• букет невесты (прокат, искусственные цветы)\nЦеремонию на английском проводит мальдивец в национальной одежде. Макияж и причёска — отдельно (из Мале, от $150), видео — от $150.',go:'mgr',gl:'Обсудить свадьбу'},
 {id:'terms',k:['условия бронир','правила бронир','обязательные услов','услови','политика бронир','политика отмен','соглашени','оферт','правила отмены и возврат'],a:'Условия бронирования экскурсий ALGA:\n\n💳 Оплата\n• Предоплата — $10 с человека за каждую экскурсию: невозвратная, входит в стоимость. Вносится в рублях по курсу USD (Россельхозбанк, покупка).\n• Остаток: рублями переводом на карту (резорты — только наличные USD), наличными USD или картой VISA / MasterCard / UnionPay в офисе — комиссия Банка Мальдив 4%.\n• Полная оплата — не позднее чем за 2 дня до экскурсии, иначе бронь может считаться отменённой по инициативе клиента.\n\n🔁 Перенос — один раз, не позднее чем за 5 дней, при наличии группы и мест.\n\n❌ Отмена\n• Вы отменяете за 24+ часа — возврат за вычетом предоплаты; менее чем за 24 часа — без возврата.\n• Отменяет компания — 100% возврат в течение 1 рабочего дня.\n• Экскурсии групповые: дата зависит от набора группы и погоды, поэтому компания может её перенести.\n\n🤒 Болезнь — возврат или перенос только по медицинской справке (на каждого участника). Солнечный ожог и критические дни — не причина для возврата или переноса.\n\n🕔 Офис — ежедневно 17:00–22:00, в другое время пишите менеджеру.\n\nБронируя экскурсии в ALGA TOURS, вы соглашаетесь с политикой бронирования и отмены.',go:'mgr',gl:'Написать менеджеру'},
{id:'full',k:['полная оплат','полную оплат','полностью оплат','оплатить полностью','всю сумму','когда доплат','до какого числа оплат','за сколько дней оплат','когда нужно оплатить'],a:'Полную оплату экскурсии нужно внести не позднее чем за 2 дня до её даты. Если полная оплата не произведена, компания вправе считать бронь отменённой по инициативе клиента.\nСпособы: рублями на карту (резорты — только наличные USD), наличными USD или картой в офисе (комиссия 4%).'},
{id:'ill',k:['заболе','болезн','болею','болен','больна','простуд','температур','справк','отравил','плохо себя чувств','ожог','обгорел','обгорела','критическ','месячн','если заболею','если заболел','заболею вернете'],a:'Если вы заболели:\nЕсли о болезни стало известно за 24 часа до экскурсии и вы хотите отменить — для возврата или переноса нужно:\n1. Сообщить менеджеру ALGA письменно (в мессенджере).\n2. Предоставить медицинскую справку о противопоказаниях на дату экскурсии — её можно получить в больнице на острове Маафуши.\n3. Справка нужна на каждого участника отдельно.\n⚠️ Без справки бронь считается отменённой без возврата и переноса.\n\n❗ Не являются причиной для возврата или переноса:\n• солнечный ожог\n• критические дни\nРиски, связанные со страной пребывания, гость учитывает самостоятельно.',go:'mgr',gl:'Написать менеджеру'},
{id:'datechg',k:['перенесли экскурс','компания перенес','могут перенести','вы можете перенести','почему перенес','изменили дату','поменяли дату','не набралась групп','набор групп','групповые экскурс','если пойдет дождь','из-за погоды','плохая погода','из за погоды'],a:'Экскурсии ALGA групповые: дата зависит от набора группы и погодных условий. Поэтому компания оставляет за собой право перенести экскурсию, если это необходимо.\nЕсли экскурсию отменяет компания — 100% возврат оплаченной суммы в течение 1 рабочего дня.'},
{id:'hours',k:['часы работы','график работы','режим работы','во сколько работает','когда работает офис','офис работает','до скольки','со скольки','время работы','офис во сколько','во сколько открыт','когда открыт','офис открыт','до скольки офис','режим офиса','открывается офис','во сколько открывается','когда открывается','офис открывается','в выходные','работаете в выход','выходные дни','без выходных'],a:'Офис ALGA на Маафуши работает ежедневно с 17:00 до 22:00. В другое время пишите менеджеру в WhatsApp или Telegram — мы на связи 24/7.\nФото и видео с экскурсии можно забрать в офисе в тот же день, с 19:00 до 22:00.'},
{id:'prepay',k:['предоплат','аванс','залог','бронирован','как забронир','забронир','бронь','платить заранее','заранее платить','бронь экскурс','забронировать экскурс'],a:'Предоплата:\n• экскурсии — $10 с человека за каждую экскурсию (невозвратная, входит в стоимость)\n• отели — 20% от стоимости, из них 2000 ₽ невозвратные\nПредоплата вносится в рублях по курсу USD (Россельхозбанк, покупка). Экскурсию нужно полностью оплатить не позднее чем за 2 дня, иначе бронь может быть отменена.',go:'form',gl:'Оставить заявку'},
 {id:'pay',k:['оплат','как плат','доллар','usd','как оплачива','оплачивается'],a:'Оплата остатка:\n• рублями переводом на карту (кроме резортов — там только наличные USD)\n• наличными USD в офисе\n• картой VISA / MasterCard / UnionPay в офисе, если карта работает за границей — комиссия Банка Мальдив 4%\nПредоплата — в рублях по курсу USD (Россельхозбанк, покупка).'},
 {id:'cancel',k:['отмен','отказ','возврат','вернут','вернете','не смогу','погода плох','плохая погода','шторм','из за погод','если погода','передума','отмн','отмена экскурс','отменить экскурс','отмена брони','отменить бронь'],a:'Отмена экскурсии:\n• если отменяете вы за 24+ часа — возврат за вычетом предоплаты\n• менее чем за 24 часа — без возврата\n• если отменяет компания (например, из-за погоды) — 100% возврат в течение 1 рабочего дня'},
 {id:'move',k:['перенес','перенос','другую дат','поменять дат','сдвинуть','поменять день','другой день'],a:'Экскурсию можно перенести на другую дату один раз — не позднее чем за 5 дней до неё, при наличии группы и свободных мест.'},
 {id:'imuga',k:['imuga','имуга','декларац','анкет','что заполнить','что нужно заполнить','форму заполн','заполнить форму','traveller declaration','qr код','qr-код','анкету заполнить','заполнить перед вылетом','заполнить перед прилет','анкету перед','какую анкету'],a:'Перед прилётом на Мальдивы каждый путешественник (включая детей) заполняет Traveller Declaration — IMUGA:\n• только на официальном сайте imuga.immigration.gov.mv — это бесплатно\n• не раньше чем за 96 часов (4 дня) до прилёта\n• после отправки придёт QR-код — покажите его на границе\n⚠️ Есть сайты-подделки, которые берут за это деньги — не платите.\nПо туру и экскурсиям — пишите менеджеру ALGA.',go:'mgr',gl:'Написать менеджеру'},
{id:'customs',k:['ввозить','ввоз','таможн','что нельзя везти','что нельзя брать','можно ли привезти','привезти с собой','алкоголь с собой','duty free','дьюти','свинин','запрещено ввоз','провезти'],a:'Что нельзя ввозить на Мальдивы (таможня Мальдив):\n• алкоголь — даже купленный в duty free, его изымут на границе\n• свинину и продукты из неё\n• вейпы и электронные сигареты — изымут\n• наркотики, порнографию, предметы для поклонения идолам, оружие\nАлкоголь на Мальдивах есть на резортах — на наших выездах на Adaaran, Centara и Sun Siyam напитки включены.',go:'res',gl:'Резорты'},
{id:'smoke',k:['кури','сигарет','табак','вейп','электронк','кальян','айкос','iqos','никотин'],a:'Курение на Мальдивах:\n• с 1 ноября 2025 года тем, кто родился 1 января 2007 года или позже, запрещено покупать и курить табак — это касается и туристов\n• вейпы и электронные сигареты запрещены для всех — ввоз, продажа и использование\nИсточник — закон Мальдив и ВОЗ.',go:'mgr',gl:'Написать менеджеру'},
{id:'loc_rules',k:['правила на острове','правила маафуши','местные правила','дресс код','дресс-код','в чем ходить','в чём ходить','купальник','бикини','bikini','можно ли в купальнике','шорты','одежда на острове','мусульман','ислам','локальном острове можно','алкоголь на маафуши','алкоголь на острове','пить на острове','где выпить','выпить','вне бикини','купаться на маафуши','купаться вне'],a:'Маафуши — локальный остров, здесь свои правила:\n• купальник и бикини — только на специальном бикини-пляже\n• в посёлке лучше прикрывать плечи и колени\n• алкоголь на локальных островах не продают\nА если хочется загорать где угодно и с коктейлем — съездите с нами на резорт на день: Adaaran и Centara — безлимитные напитки, Sun Siyam — напитки с 10:00 до 16:30.',go:'res',gl:'Резорты'},
{id:'green_tax',k:['green tax','грин такс','зеленый налог','зелёный налог','налог за ночь','туристический налог','туристический сбор','налог на проживан'],a:'Green Tax — налог за каждую ночь проживания, его берёт отель:\n• гестхаусы и отели до 50 номеров на локальных островах (как Маафуши) — $6 с человека за ночь\n• резорты и крупные отели — $12 с человека за ночь\n• дети до 2 лет — бесплатно\nДанные налоговой Мальдив (MIRA). По отелям на Маафуши подскажет менеджер ALGA.',go:'mgr',gl:'Написать менеджеру'},
{id:'dep_tax',k:['налог на вылет','сбор на вылет','departure tax','сбор в аэропорт','налог в аэропорт','аэропортовый сбор','платить при вылете','налог при вылете','налог при выезде','сбор при вылете','платить налог при'],a:'Сбор при вылете с Мальдив для иностранцев: эконом — $50, бизнес — $120, первый класс — $240 (с 1 декабря 2024 года). Обычно он уже включён в стоимость авиабилета, отдельно в аэропорту платить не нужно. Дети до 2 лет и транзит до 24 часов — освобождены.',go:'mgr',gl:'Написать менеджеру'},
{id:'get_maaf',k:['добраться до маафуши','доехать до маафуши','как попасть на маафуши','из аэропорта','с аэропорта','от аэропорта','паром','ферри','ferry','спидбот','speedboat','скоростной катер','трансфер из аэропорта','трансфер с аэропорта','как доехать до острова','из аэропорта на маафуши','аэропорта на маафуши','паром до маафуши','ходит паром','ходит ли паром'],a:'Из аэропорта Велана до Маафуши:\n• скоростной катер (спидбот) — около 30–45 минут, самый удобный вариант\n• государственный паром — дешевле, но дольше, и по пятницам не ходит\nРасписание и цены меняются — уточняйте перед поездкой. Менеджер ALGA подскажет по трансферу и отелю.',go:'mgr',gl:'Написать менеджеру'},
{id:'sim',k:['где купить сим','купить сим','сим карт','симку','симка','sim','esim','есим','мобильный интернет','связь на мальдив','интернет на мальдив','роуминг','dhiraagu','ooredoo','дирагу','уредо'],a:'Связь на Мальдивах:\n• два оператора — Dhiraagu и Ooredoo, у обоих хороший 4G\n• туристическую SIM можно купить сразу в зоне прилёта аэропорта Велана — нужен паспорт\n• есть и eSIM\nНа резортах во время наших выездов есть Wi-Fi (на Centara — безлимитный).',go:'res',gl:'Резорты'},
{id:'ws_rules',k:['правила с китовой','как вести себя с китовой','трогать китов','можно трогать китов','потрогать китов','на каком расстоянии','расстояние до акул','вспышк','южный ари','south ari','круглый год китов','китовые акулы круглый','потрогать китовую','трогать китовую','потрогать акул','трогать акул','круглый год ли китов','китовые акулы круглый год','круглый год ли'],a:'Китовые акулы живут в Южном Ари круглый год — это одно из немногих таких мест в мире. Правила встречи (Maldives Whale Shark Research Programme):\n• не трогать акулу\n• держаться на расстоянии 3–4 метров\n• не плыть наперерез и не создавать брызг\n• без вспышки\n• всегда слушать гида\nСнорклинг с китовой акулой с ALGA — $110, дети 3–10 лет — $70.',go:'exc',gl:'Экскурсии'},
{id:'x_ride_whale',k:['сколько плыть до китов','сколько ехать до китов','далеко ли китов','далеко до китов','как далеко китов','сколько в пути','сколько добираться до китов','долго плыть','долго ехать','дорога до китов','южный ари далеко','сколько часов на катере'],a:'Китовые акулы живут в Южном Ари — по данным операторов, от Маафуши это около 1,5–2 часов на скоростном катере в одну сторону (зависит от того, где в этот день встречают акулу).\nПоэтому это экскурсия на весь день: сбор в 7:00 у причала Маафуши, выход в 7:30 → китовая акула → лагуна с мантами → остров «Пикник» (ланч, вода, полотенца) → возвращение около 15:00.\nЦена — $110, дети 3–10 лет — $70.',go:'exc',gl:'Экскурсии'},
{id:'ws_guar',k:['точно увидим','гарантия','гарантир','обязательно увидим','а если не увидим','если не увидим','не увидели','не встретим','шанс увидеть','какой шанс','вероятность','не увидим вернете','акулу не увидим','китовую акулу не увидим','вернете деньги если не увидим'],a:'Китовые акулы держатся в Южном Ари круглый год — это одно из немногих таких мест в мире. Но это дикие животные в открытом океане, поэтому встречу не гарантирует никто.\nЧто будет, если в ваш день акулу не встретили, — уточните у менеджера ALGA до бронирования.',go:'mgr',gl:'Написать менеджеру'},
{id:'seasick',k:['укачива','укачает','морская болезнь','морской болезн','тошнит','тошнота','таблетки от укач','драмина','плохо на катере','плохо переношу катер'],a:'Если укачивает:\n• примите средство от укачивания примерно за час до выхода (какое — посоветуют в аптеке или врач)\n• на катере смотрите на горизонт\nМоре спокойнее всего с декабря по апрель. Самая короткая поездка — Half Day ($35); самая долгая — китовая акула (около 1,5–2 часов в одну сторону).',go:'exc',gl:'Экскурсии'},
{id:'x_lunch',k:['обед на экскурс','есть ли обед','кормят на экскурс','будет еда','еда на экскурс','ланч','перекус','вода на экскурс','полотенца на экскурс','дают полотенц','дают ли полотенц','вегетариан','веган','аллерги'],a:'На всех наших морских экскурсиях включены ланч на острове, вода и пляжные полотенца. На «Аквариуме» на песчаной косе есть ещё зонты от солнца.\nЕсли нужна вегетарианская еда или есть аллергия — напишите менеджеру заранее.',go:'exc',gl:'Экскурсии'},
{id:'x_bring',k:['что взять на экскурс','что брать на экскурс','что с собой на экскурс','что нужно на экскурс','взять с собой на экскурс','что взять с собой на кос','что надеть на экскурс'],a:'На экскурсию выдаём: снаряжение SCUBA PRO (маска, трубка, ласты, спасательный жилет), воду, ланч, полотенце. Фото и видео под водой снимаем на GoPro 12/13 — тоже включено.\nС собой возьмите купальник, солнцезащитный крем и головной убор: солнце на Мальдивах очень сильное, сгореть можно даже в облачную погоду.',go:'exc',gl:'Экскурсии'},
{id:'x_meet',k:['место сбора','где сбор','где встречаемся','откуда отплыва','откуда выезд','где встреча','во сколько сбор','во сколько встречаемся','заберете из отеля','забираете из отеля','трансфер от отеля','забрать из отеля'],a:'Сбор — у причала Маафуши, там же выбираем снаряжение:\n• Китовая акула — сбор 7:00, выход 7:30, возвращение 15:00\n• Акулы, коса, дельфины и скаты — сбор 7:45, выход 8:00, возвращение 14:30\n• «Аквариум» — сбор 9:00, выход 9:15, возвращение 15:00\nТочное время для вашей даты подтвердит менеджер.',go:'exc',gl:'Экскурсии'},
{id:'x_gopro',k:['gopro','гопро','го про','кто снимает','снимаете ли вы','фото под водой','подводная съемка','телефон в воду','телефон под воду','аквабокс','чехол для телефона'],a:'Фото и видео под водой снимаем мы — на GoPro 12/13, это входит в экскурсию. Забрать их можно в нашем офисе на Маафуши в этот же день с 19:00 до 22:00.\nСъёмка с дрона на акулах и на косе — по $20 с человека за локацию.',go:'exc',gl:'Экскурсии'},
{id:'x_shade',k:['тень на кос','есть ли тень','зонт','спрятаться от солнца','где спрятаться','тень на песчаной','есть ли тень на'],a:'На песчаной косе во время «Аквариума» ставим зонты от солнца. На других экскурсиях возьмите головной убор и солнцезащитный крем — солнце сильное.',go:'exc',gl:'Экскурсии'},
{id:'x_two',k:['две экскурсии в один день','2 экскурсии в день','две экскурсии за день','несколько экскурсий в день','сколько экскурсий успеть','сколько экскурсий за неделю','экскурсий за неделю'],a:'По расписанию наши морские экскурсии идут в первой половине дня и пересекаются по времени (выход 7:30–9:15, возвращение 14:30–15:00), поэтому обычно это одна экскурсия в день. Составить план под ваши даты поможет менеджер.',go:'mgr',gl:'Написать менеджеру'},
{id:'atm',k:['банкомат','atm','снять деньги','снять наличн','снять доллар','обменник','обмен валют','поменять деньги','где взять доллар','банк на маафуши'],a:'На Маафуши есть банкоматы: Bank of Maldives (с 2024 года — банкомат с долларами USD) и MIB (USD и руфии). Это удобно: резорты оплачиваются только наличными USD.\nЕсли ваша карта не работает за границей — доллары лучше привезти с собой.',go:'mgr',gl:'Написать менеджеру'},
{id:'doctor',k:['врач','доктор','больниц','медпункт','клиник','аптек','поликлиник','медицин','скорая','заболею на острове','врач на маафуши','есть ли врач'],a:'На Маафуши есть медицинский центр Maafushi Health Centre (Минздрав Мальдив). В серьёзных случаях везут в Мале — это около 30–45 минут на катере. Медицинская страховка в поездку очень желательна.',go:'mgr',gl:'Написать менеджеру'},
{id:'float_bar',k:['плавучий бар','бар на воде','бар на корабле','бар на яхте','floating bar','алкобар','где купить алкоголь','где выпить вечером','вечеринк','тусовк'],a:'На самом Маафуши алкоголь не продают — это местный остров. Рядом с ним стоят плавучие бары: переоборудованные яхты в нескольких минутах от берега, туда обычно отвозит отель.\nА если хотите целый день с безлимитными напитками, пляжем и бассейном — выезд на резорт: Adaaran и Centara — безлимит, Sun Siyam — напитки с 10:00 до 16:30.',go:'res',gl:'Резорты'},
{id:'fishing',k:['рыбалк','рыбачить','ловить рыб','порыбачить','ночная рыбалк','fishing'],a:'Рыбалку организуем. Программу, время и цену уточните у менеджера ALGA. Оплата рыбалки — только наличными USD.',go:'mgr',gl:'Написать менеджеру'},
{id:'res_other',k:['спа на резорт','пользоваться спа','массаж на резорт','каяк на резорт','снаряжение на резорт','маски на резорт','своя еда','свою еду','свою еду на резорт','уехать раньше','вернуться раньше','вернуться с резорта раньше','поменять резорт','сменить резорт','дождь на резорт','если на резорте дождь','детская зона','детский клуб','аниматор','анимация на резорт','взять каяк','каяк','полотенца на резорте','дают ли полотенца на резорт','поменять резорт в день','снаряжение для снорклинга на резорт','детская зона на резорт'],a:'В выезд на резорт входит только то, что указано у каждого резорта (обед, напитки, лежаки, полотенца, трансфер — у каждого свой набор, спросите «что входит в Adaaran» и т.п.).\nСПА, водные развлечения, смена резорта или раннее возвращение в описании не указаны — по этим вопросам напишите менеджеру, он уточнит у конкретного резорта.',go:'mgr',gl:'Написать менеджеру'},
{id:'visa',k:['виза ','визу','визы','визе','паспорт','разрешени','граница','въезд','90 дней','продлить виз','продление виз','на сколько дней дают','на сколько дней','сколько дней','пускают','впускают','турист','въех','въезж','заехать на мальдив','как турист','туристом','пребыван','сколько можно находит','сколько могу находит','сколько можно быть','сколько можно жить','сколько можно остат','могу остат','остаться на','сколько дней можно','на сколько дней могу','сколько дней могу','без визы','нужна виза','нужна ли виза','штамп','сколько дней дают виз','сколько дней виза','на сколько дней виза','дают визу','виза на сколько','срок виз','загранпаспорт','загран'],a:'Гражданам России виза на Мальдивы не нужна: бесплатное разрешение на пребывание на 30 дней ставят в паспорт по прилёте. При необходимости его можно продлить — всего до 90 дней (решение принимает иммиграционная служба Мальдив).\nПо правилам иммиграционной службы паспорт должен действовать минимум 1 месяц (авиакомпании могут требовать больше — проверьте у перевозчика). Нужны обратный билет и бронь жилья.\nИ не забудьте за 96 часов до прилёта заполнить бесплатную декларацию IMUGA на imuga.immigration.gov.mv.'},
 {id:'contact',k:['связ','контакт','whatsapp','ватсап','вотсап','телеграм','telegram','позвон','написать','менеджер','катя','катерин','екатерин','ответ','телефон','номер тел'],a:'Мы на связи 24/7 в WhatsApp и Telegram, среднее время ответа — около 15 минут. Или оставьте заявку прямо в приложении.',go:'mgr',gl:'Написать в Telegram'},
 {id:'about',k:['кто вы','о вас','о компани','агентств','alga','алга','основател','давно','опыт','надежн','чем занимает','кто такие','кто такая','кто основатель','основатель','кто владелец','кто вы такие'],a:'ALGA — туристическое агентство на Мальдивах. Основатель — Екатерина: больше 10 лет живёт на Мальдивах, создаёт авторские туры, организует экскурсии и лично сопровождает гостей. Работаем с отелями по прямым контрактам, без посредников, поддержка 24/7.'},
 {id:'why',k:['почему вы','почему с вами','выгодн','дешевл','лучшая цен','скидк','booking','букинг','чем вы лучше','почему не напрямую','напрямую','почему ваша цена','почему у вас','почему дешевле','почему лучше','чем вы отличаетесь','стоит выбрать вас','выбрать вас','почему стоит','почему именно вы','почему именно вас','дорого ли','дорого у вас','у вас дорого','дорого'],a:'Почему с ALGA выгоднее: прямые контракты с отелями без посредников, гарантия лучшей цены и доступ к виллам, которых нет на Booking. На связи 24/7.'},
 {id:'island',k:['маафуши','maafushi','локальный остров','где вы','где находит','офис','причал','как вас найти','найти вас','что за остров','какой остров','где остров'],a:'Мы базируемся на острове Маафуши — экскурсии и выезды на резорты стартуют от причала Маафуши, там же наш офис (фото с экскурсий, оплата наличными или картой).'},
 {id:'pg_what',k:['что такое пресет','зачем нужны пресет','зачем пресет','для чего пресет','для чего нужны пресет','что дают пресет','что это пресет','пресеты это','что за пресет','что значит пресет','объясните пресет'],a:'Что такое пресет — простыми словами:\nПресет — это сохранённый набор настроек обработки фото в Lightroom: свет, цвет, контраст, оттенки. Нажимаете на пресет — и фото в одно касание получает авторский цвет, как у фотографа.\n\nLUT — то же самое, но для видео: таблица цвета для DaVinci, Premiere, VN.\n\nЗачем они нужны:\n• экономят время — не нужно крутить десятки ползунков\n• все фото из поездки получаются в одном стиле\n• профессиональный результат без навыков ретуши\n\nПресеты Maldives от Антона Аванзато — 5 пресетов + 5 LUT, созданы под бирюзу моря, белый песок и загар. Пресет — стартовая точка: под каждое фото чуть подкрутите экспозицию и баланс белого.',go:'pre',gl:'Пресеты'},
{id:'pg_apply',k:['применять пресет','как применять','применит','применя','наложит','наложени','накинуть','как применить','применить его','применить их','как поставить пресет','как обработать фото пресет','как сохранить фото после','экспорт фото'],a:'Как применить пресет к фото:\n\n📱 На телефоне (Lightroom Mobile):\n1. Откройте фото в Lightroom.\n2. Внизу найдите вкладку «Стили» (Presets).\n3. Выберите группу, куда сохранили пресеты, и нажмите на нужный — фото сразу изменится.\n4. Появится ползунок «Величина» — подберите силу эффекта (обычно 60–100%).\n5. Нажмите ✓ и подкрутите кадр: «Свет» → экспозиция, «Цвет» → температура.\n6. Сохраните: «Поделиться» → «Экспорт в фотопленку».\n\n💻 На компьютере (Lightroom Classic):\n1. Модуль «Develop / Обработка».\n2. Слева панель «Presets / Стили» — наведите курсор, чтобы увидеть превью.\n3. Клик по пресету — применить. Справа подкрутите экспозицию и баланс белого.\n4. Экспорт: File → Export (Ctrl/Cmd+Shift+E).\n\n🎬 LUT на видео: DaVinci (Color → нода → LUTs), Premiere (Lumetri → Creative → Look) или VN (фильтры → импорт LUT).\n\nЕсли пресеты ещё не установлены — спросите «как установить пресеты на телефон».',go:'pre',gl:'Пресеты'},
{id:'pg_how',k:['как пользоваться пресет','как использовать пресет','как применить пресет','как работать с пресет','инструкция пресет','инструкция к пресет','как пользоваться лут','как применять пресет','пользоват','как ими','как их использ','как использоват','инструкц','как применят','не знаю как','как работают пресет','как работает пресет'],a:'Как пользоваться пресетами — коротко:\n1. Установите пресеты в Lightroom (на телефоне — файлы DNG, на компьютере — XMP).\n2. Откройте фото и выберите пресет — это стартовая точка, не финал.\n3. Подкрутите под конкретный кадр: экспозиция → баланс белого → света и тени → цвет.\n4. Если эффект слишком сильный — уменьшите «Величину» пресета.\n5. Для серии: доведите одно фото и скопируйте настройки на остальные, потом поправьте экспозицию на каждом.\nСпросите «как установить на телефон» или «что подкручивать после пресета» — расскажу подробно.',go:'pre',gl:'Пресеты'},
{id:'pg_mob',k:['установить пресет','установка пресет','как установить','добавить пресет','загрузить пресет','импорт пресет','dng установ','lightroom mobile','лайтрум на телефон','создать стиль'],a:'Установка в Lightroom Mobile (iPhone и Android), файлы DNG:\n1. Сохраните DNG-файлы пресетов на телефон (распакуйте архив, если он в .zip).\n2. В Lightroom нажмите «Добавить фото» и импортируйте эти DNG как обычные снимки.\n3. Откройте первый DNG → «⋯» (вверху справа) → «Создать стиль».\n4. Дайте название, выберите группу (например, «Мои стили») → ✓.\n5. Повторите для каждого DNG.\nГотово: на любом фото — вкладка «Стили» → ваша группа → выбирайте пресет.\nСовет: DNG-файлы после этого можно удалить из Lightroom — стили останутся.',go:'pre',gl:'Пресеты'},
{id:'pg_pc',k:['на компьютер','на ноутбук','lightroom classic','лайтрум классик','xmp установ','на мак','на macbook','на windows','на виндоус'],a:'Установка в Lightroom Classic (macOS и Windows), файлы XMP:\n1. Распакуйте архив.\n2. Откройте модуль «Develop / Обработка».\n3. Слева панель «Presets / Стили» → «+» → «Import Presets / Импорт стилей».\n4. Выберите XMP-файлы (или сразу .zip) → «Import».\nПресеты появятся в панели слева — наведите курсор, чтобы увидеть превью, клик — применить.\nВ Lightroom (облачном, не Classic): «Правка» → «Стили» → «⋯» → «Импорт стилей».',go:'pre',gl:'Пресеты'},
{id:'pg_lut',k:['как установить lut','как установить лут','lut в davinci','лут в давинчи','lut в premiere','лут в премьер','cube установ','как применить lut','как применить лут','лут на видео'],a:'LUT для видео (файлы .cube):\n• DaVinci Resolve: Project Settings → Color Management → «Open LUT Folder», скопируйте туда .cube → «Update Lists». Дальше на странице Color: правый клик по ноде → LUTs → выберите LUT.\n• Premiere Pro: панель Lumetri Color → Creative → Look → «Browse…» → выберите .cube.\n• VN и другие мобильные редакторы: в разделе фильтров — импорт LUT (.cube), затем примените к клипу.\nВажно: сначала выровняйте экспозицию и баланс белого клипа, потом LUT. Если цвет слишком сильный — уменьшите интенсивность или непрозрачность LUT.',go:'pre',gl:'Пресеты'},
{id:'pg_tune',k:['что подкручивать','что подкрутить','что крутить','как доводить','как довести','доработать после пресет','после пресета','не так выглядит','выглядит не так','не как в примере','не как на примере','не получается как','какие ползунки','что настроить','как настроить пресет'],a:'Что подкручивать после пресета — по порядку (на каждом фото свой свет, поэтому один пресет не даёт одинаковый результат без доводки):\n1. Экспозиция — лицо или главный объект должен быть хорошо читаем. Обычно ±0,3–1.\n2. Баланс белого: «Температура» — теплее/холоднее, «Оттенок» — убрать зелень или пурпур. Это главное отличие между кадрами.\n3. Света — вниз, если пересвечено небо или белая одежда. Тени — вверх, если провалились детали.\n4. Белые и чёрные — для контраста: белые чуть вверх, чёрные чуть вниз.\n5. Красочность/насыщенность — уменьшите, если цвета «кричат».\n6. Цвет (HSL): оранжевый — кожа, синий и бирюзовый — небо и вода, зелёный — листва.\n7. «Величина» пресета — 60–100%, по вкусу.\n8. Ночные и тёмные кадры — добавьте шумоподавление.\nПравило: двигайте ползунки понемногу и сравнивайте с оригиналом (долгое нажатие на фото).',go:'pre',gl:'Пресеты'},
{id:'pg_skin',k:['кожа после пресет','кожа оранжев','кожа желт','кожа красн','кожа зелен','кожа сер','оранжевая кожа','желтая кожа','тон кожи пресет','цвет кожи пресет','лицо оранжев','лицо желт','кожа оранжевая после','оранжевая после пресет','кожа после'],a:'Кожа после пресета:\n• Слишком оранжевая или жёлтая → Цвет (HSL) → Оранжевый: насыщенность −5…−15, яркость +5…+10.\n• Слишком красная → Красный: насыщенность −5…−10, оттенок чуть к оранжевому.\n• Серая или бледная → Оранжевый: насыщенность +5, температура чуть теплее.\n• Зеленоватая (свет от листвы) → «Оттенок» в балансе белого чуть вправо, к пурпуру.\n• Слишком контрастная → «Текстура» −5…−10, «Ясность» вниз.\nГлавное — естественность: сравнивайте с оригиналом.',go:'pre',gl:'Пресеты'},
{id:'pg_fix',k:['слишком темно','слишком темное','темное фото','пересвет','все желтое','все синее','зеленый оттенок','слишком ярко','кислотн','блекл','шум на фото','шумит','фото испортил','пресет испорт','плохо легло','плохо ложится','после пресета темн','темное после','стало темн','стало желт','стало темное'],a:'Частые проблемы и как исправить:\n• Слишком темно → Экспозиция вверх, Тени вверх.\n• Пересвечено небо → Света вниз, Белые вниз.\n• Всё жёлтое/оранжевое → Температура холоднее.\n• Всё синее → Температура теплее.\n• Зелёный оттенок → Оттенок вправо (к пурпуру).\n• Слишком ярко и «кислотно» → Красочность/насыщенность вниз или «Величина» пресета 60–80%.\n• Плоско и блёкло → Контраст или Чёрные вниз чуть-чуть.\n• Шум на ночных фото → Детализация → Шумоподавление +20…40.\nПресет лучше всего ложится на RAW с нормальной экспозицией; на JPEG и сильно тёмных кадрах доводки нужно больше.',go:'pre',gl:'Пресеты'},
{id:'pg_batch',k:['серию фото','на все фото','сразу на несколько','много фото сразу','скопировать настройк','копировать настройк','синхрониз','одинаково обработ','пакетн'],a:'Как обработать серию одинаково:\n• Lightroom Mobile: доведите одно фото → «⋯» → «Копировать настройки» → выделите остальные → «Вставить настройки».\n• Lightroom Classic: доведите фото → выделите серию → «Sync / Синхронизировать» (или Ctrl/Cmd+Shift+S), выберите, что переносить.\nПосле этого пройдитесь по каждому кадру и поправьте экспозицию и температуру — свет между кадрами всегда немного разный.',go:'pre',gl:'Пресеты'},
{id:'pg_amt',k:['сила пресет','интенсивност','величина пресет','ослабить пресет','слабее пресет','слишком сильн','уменьшить эффект','процент пресет'],a:'Сила пресета:\n• В Lightroom (Mobile и обычный) под выбранным стилем есть ползунок «Величина» — от 0 до 200%. Для мягкого результата — 60–80%.\n• В старых версиях Lightroom Classic такого ползунка нет — уменьшайте вручную насыщенность, контраст и «Ясность».\n• Для видео-LUT — уменьшите интенсивность/непрозрачность LUT в редакторе.',go:'pre',gl:'Пресеты'},
{id:'pg_sea',k:['подводн','под водой','цвет моря','цвет воды','бирюз','море на фото','фото на пляже','цвет неба','небо на фото','океан'],a:'Море, небо и подводные фото (пресеты Maldives):\n• Бирюза воды: Цвет (HSL) → Голубой/Аква — оттенок и насыщенность под ваш вкус; Синий — небо.\n• Небо пересвечено → Света вниз, можно маску «Небо» и чуть убрать экспозицию.\n• Подводные кадры: используйте Maldives 05 (подводный), затем температуру теплее и «Удаление дымки» +10…+30 — под водой всё синит и «мутит».\n• Яркое солнце и белый песок: Белые и Света вниз, чтобы не терять детали.\n• Кожа на пляже часто становится слишком оранжевой — уберите насыщенность оранжевого.',go:'pre',gl:'Пресеты'},
{id:'pre_get',k:['как получу пресет','как получить пресет','куда пришлете пресет','когда пришлете пресет','после оплаты пресет','как скачать пресет','скачать пресет','ссылку на пресет','как придут пресет','куда придут','когда придут'],a:'После заявки Антон Аванзато напишет вам в Telegram и пришлёт реквизиты, а после оплаты — ссылку на пресеты. Дальше:\n1. Скачайте и распакуйте архив.\n2. Установите пресеты в Lightroom (спросите «как установить пресеты на телефон»).\n3. Применяйте к фото и подкручивайте под каждый кадр.\nВопросы — Telegram @avanzato.',go:'pre',gl:'Пресеты'},
{id:'presets',k:['пресет','lut','лут','lightroom','лайтрум','обработк фото','обработка фото с мальдив','цвет мальдив'],a:'Пресеты Maldives — авторские настройки фотографа Антона Аванзато: цвет Мальдив для ваших фото и видео в пару касаний. Они подчёркивают детали, усиливают нужные оттенки и убирают лишние цвета — профессиональный результат в несколько кликов.\n\n• 5 пресетов для фото + 5 LUT для видео\n• Lightroom Mobile и Classic, DaVinci, Premiere, VN, Liit\n• цена — 3 000 ₽',go:'pre',gl:'Пресеты'},
{id:'pre_diff',k:['отличается от lut','отличается от лут','от lut','чем пресеты отлича','пресет и lut','пресеты и лут','разница пресет','отличие пресет','что такое lut','что такое лут','lut это','пресеты для видео','для видео пресет','на видео','для видео','видео тоже','лут','lut','пресеты на видео','пресет на видео'],a:'Пресеты — настройки для обработки фото в Lightroom. LUT — таблицы цвета для видео: DaVinci Resolve, Premiere, VN.\nПроще: пресеты — для фото, LUT — для видео. В наборе Maldives есть и то и другое: 5 + 5.',go:'pre',gl:'Пресеты'},

{id:'pre_skill',k:['нужны ли навык','навык','сложно ли','я новичок','не умею обрабат','умею ли','пресеты для новичк','новичок справ','сложно пользоват','сложно ли пользоват','никогда не обрабатыв','не обрабатывал','не умею','без опыта','впервые','новичок в обработк','для новичков пресет'],a:'Профессиональные навыки не нужны — пресеты применяются в одно касание, даже если вы только начинаете.',go:'pre',gl:'Пресеты'},

 {id:'sharks',k:['shark','nurse','dolphin','sting','ray ','rays','sandbank','sand bank','sand spit'],a:'Sharks, sandbank, dolphins & rays — $65 per person (all taxes and fees included):\n• children 3–10 — $40, under 3 — free\n• private trip — $2000 (up to 18 people)\n\nMeet at 7:45, departure from Maafushi pier at 8:00: dolphins → rays → snorkeling with nurse sharks → sandbank. Back at 14:30.\nGear, lunch, water and towels included. Drone footage — $20 per person per location.\n\n⚠️ ALWAYS listen to the guide. Never swim near the boat propellers. Ask “safety rules” for the full list.',go:'exc',gl:'Excursions'},

 {id:'photos',k:['photos from','videos from','get the photos','pick up photos','when photos','where photos','photo and video','get our photos','our photos','the photos'],a:'You can pick up photos and videos from the excursion at our agency the same day, from 19:00 to 22:00.'},
 {id:'equip',k:['gear','equipment','mask','fins','snorkel gear','life jacket','vest','what to bring','towel','lunch','food','meal','what is included in the excursion','water provided','drinking water','what s included','is included'],a:'On excursions we provide gear: masks, fins, snorkels and life vests. Lunch, water and beach towels are included too (on the Aquarium trip — also sun umbrellas).\nFood and drinks are not included on the Malé tour.'},
 {id:'safety',k:['safety rules','rules','what not to do','not allowed','propeller','near the boat','spread my arms','arms','touch','feed','coral','listen to the guide','briefing','touch the shark','touch a shark','touch the ray','touch the turtle','can i touch'],a:'⚠️ SAFETY RULES — MANDATORY FOR EVERYONE ⚠️\n\n‼️ ALWAYS LISTEN TO THE GUIDE. ALWAYS. No exceptions. The guide knows the sea, the currents and the animals — their word is final.\n\n🚤 Boat:\n• Do NOT swim near the propellers or the back of the boat — it can be fatal.\n• Do not jump in or climb aboard without the guide’s signal.\n• While the boat is moving or the engine is starting — everyone stays on board.\n\n🦈 Sharks and rays:\n• During drone filming do NOT SPREAD YOUR ARMS out — keep them close to your body.\n• Do NOT touch, grab or feed sharks, rays, turtles or fish.\n• Do not swim at the animals or chase them — move calmly.\n\n🌊 In the water:\n• Can’t swim or a weak swimmer — a life vest is mandatory, keep it on.\n• Stay with the group and within the guide’s sight, don’t swim far away.\n• Don’t stand on or touch corals — you can get cut and the reef dies.\n• Tired, cold or scared — raise your hand, the guide will help.\n\n☀️ Sun: sunscreen, a hat and water — sunburn is not a reason for a refund or rescheduling.\n\nOnce more: LISTEN TO THE GUIDE. It is your safety.',go:'exc',gl:'Excursions'},
{id:'swim',k:['can t swim','cannot swim','can not swim','not swim','bad swimmer','afraid','scared','safe','safety','danger','dangerous','bite','non swimmer','non-swimmer','weak swimmer','safe to swim','is it safe'],a:'We provide life vests, masks and fins, and our team is always next to you — swimming with nurse sharks and rays is calm and safe, many guests do it for the first time. If you have doubts, message us and we will suggest the right option.\n\n⚠️ ALWAYS listen to the guide. Never swim near the boat propellers. Ask “safety rules” for the full list.',go:'mgr',gl:'Message a manager'},
 {id:'r_sunsiyam',k:['sun siyam','sunsiyam','olhuveli','olhuvelhi','included at sun siyam','included in sun siyam','what is included at sun siyam','what s included at sun siyam','at sun siyam','included at olhuveli','included in olhuveli','what is included at olhuveli','what s included at olhuveli','at olhuveli'],a:'🏝 Olhuveli Sun Siyam — resort day trip\n💵 $145 per person · kids 2–12 — $85 · under 2 — free\n🕘 09:00–17:00 · about 15 minutes by boat from Maafushi\n\nIncluded:\n• lunch — buffet\n• alcoholic and soft drinks, water — 10:00–16:30\n• sunbeds and towels\n• transfer both ways\n\nOn the island: three pools, four water-villa structures, a tennis court, an ocean-side SPA, three bars and two restaurants. Lots of swings, sofas and loungers — free to use.\n\nBook and pay no later than 21:00 the day before.',go:'res',gl:'Resorts'},
{id:'r_adaaran',k:['adaaran','ranhali','included at adaaran','included in adaaran','what is included at adaaran','what s included at adaaran','at adaaran','included at ranhali','included in ranhali','what is included at ranhali','what s included at ranhali','at ranhali'],a:'🏝 Adaaran Club Ranhali — resort day trip\n💵 $130 per person · kids 2–12 — $90 · under 2 — free\n🕘 09:00–17:00 · 15–20 minutes by boat from Maafushi\n\nIncluded:\n• unlimited alcoholic and soft drinks all day\n• lunch at the resort restaurant — buffet\n• tea/coffee and snacks (cakes, sandwiches) twice a day\n• unlimited Wi-Fi across the hotel\n• towel and sunbeds\n• transfer\n\nOn the island: small and cozy, 2 overwater bars, a restaurant, a cinema, a diving center, a SPA, famous water villas and a wonderful reef.\n\nBook and pay no later than 21:00 the day before.',go:'res',gl:'Resorts'},
{id:'r_fihal',k:['fihalhohi','included at fihalhohi','included in fihalhohi','what is included at fihalhohi','what s included at fihalhohi','at fihalhohi'],a:'🏝 Fihalhohi Island Resort — resort day trip\n💵 $130 per person · kids 2–12 — $90 · under 2 — free\n🕘 09:00–17:00 · 15–20 minutes by boat from Maafushi\n\nIncluded:\n• lunch on the island — buffet\n• Wi-Fi across the island\n• unlimited alcoholic and soft drinks — drinking only at the bar\n• transfer\n\nOn the island: beautiful water villas and the most beautiful reef — while swimming you can see stingrays, sharks, crabs and turtles.\n\nBook and pay no later than 21:00 the day before.',go:'res',gl:'Resorts'},
{id:'r_centara',k:['centara','ras fushi','included at centara','included in centara','what is included at centara','what s included at centara','at centara','included at ras fushi','included in ras fushi','what is included at ras fushi','what s included at ras fushi','at ras fushi'],a:'🏝 Centara Ras Fushi — resort day trip (adults only)\n💵 $160 per person\n⛔️ Guests 18+ only — children are NOT allowed.\n🕘 08:00–18:30 — the longest day of all resorts\n\nIncluded:\n• unlimited alcoholic and soft drinks\n• lunch — buffet at the resort restaurant\n• beach towel, sunbeds, pool\n\nOn the island: a small adults-only island, a pool area with a swim-up bar, tables with umbrellas right in the water, unlimited Wi-Fi.\n\nBook and pay for the transfer no later than 21:00 the day before.',go:'res',gl:'Resorts'},
{id:'r_cmp',k:['which resort','best resort','compare resorts','difference between resorts','best reef','alcohol included','unlimited drinks','swim-up bar','swim up bar','tennis','resort with pool','recommend a resort'],a:'How to choose a resort for the day:\n• Most beautiful reef, rays and sharks off the beach → Fihalhohi ($130)\n• Most facilities: 3 pools, tennis, SPA, 3 bars → Sun Siyam ($145)\n• Unlimited drinks all day, snacks, Wi-Fi, overwater bars → Adaaran ($130)\n• No kids, longest day 08:00–18:30, swim-up bar → Centara ($160, 18+ only)\n• With kids → Sun Siyam (kids $85), Adaaran or Fihalhohi (kids $90, under 2 free)\n• Alcohol is included at all four (Sun Siyam 10:00–16:30, Fihalhohi — at the bar only).\nAll resorts are 15–20 minutes by boat from Maafushi, book by 21:00 the day before.',go:'res',gl:'Resorts'},
{id:'res',k:['resort','day visit','day trip to resort','all inclusive','all-inclusive'],a:'Day visits to 5* resorts from Maafushi (usually 9:00–17:00, boat transfer, buffet lunch, drinks, beach):\n• Olhuveli Sun Siyam — $145, children 2–12 $85\n• Adaaran Club Ranhali — $130, children 2–12 $90, under 2 free\n• Fihalhohi Island — reef with rays and sharks, unlimited drinks\n• Centara Ras Fushi — $160, 18+ only, 8:00–18:30\nBook and pay by 21:00 the day before.',go:'res',gl:'Resorts'},
 {id:'hotels',k:['hotel','guesthouse','where to stay','accommodation','stay on','room','check in','check-in','kaani','arena','icom','palms','thoddoo','where should we stay','place to stay'],a:'Hotels on local islands via direct contracts, no middlemen:\n• Maafushi — Kaani Palm, Kaani Grand, Arena Beach, Icom Blue\n• Thoddoo — The Palms (quiet island, beaches and plantations)\n\nDeposit — 20% of the total (2000 RUB of it is non-refundable); the rest is paid in USD at check-in. Available dates and seasonal prices are on each hotel page.',go:'hot',gl:'Hotels'},
 {id:'lux',k:['luxury','villa','water villa','overwater','private island','stay at a resort','stay in a resort','premium','vip','honeymoon'],a:'Booking stays at premium resorts and private islands — concierge service together with BE IN MALDIVES. Every request is handled individually: we will find the island and villa, including options not available on Booking.',go:'mgr',gl:'Message a manager'},
 {id:'flight',k:['flight','flights','airfare','plane ticket','air ticket','airline','how to get to the maldives','how do we get there','get to maldives','cheap tickets','cheap flights','flight cost','ticket price','is airfare included','airfare included in the tour','are flights included','flights included in the tour','flight included in the tour'],a:'Flights are not included in the signature tour — you buy tickets to Malé (Velana airport) separately.\n\n✈️ Cheap tickets to the Maldives do come up, but you need to catch them yourself: watch for sales and book early. Any other tour questions — ask a manager.',go:'mgr',gl:'Message a manager'},
{id:'tour',k:['signature','author','group tour','tour','itinerary','islands','5 islands','7 islands','journey','people in the group','group size','how many people'],w:['how much','cost','price'],a:'Signature tour on Maafushi — from $1960:\n• 5–7 islands and the underwater world\n• photo and video shoot\n• groups of 8–12 people\n• comfortable stay, boat trips, the best spots\n\n✈️ Flights are not included — you buy tickets to Malé separately. Cheap tickets to the Maldives do come up, but you need to catch them yourself.\n\nDates 2026–2027: 01.11–08.11, 30.12–06.01 (New Year), 24.01–31.01, 13.02–20.02, 06.03–13.03, 20.03–27.03, 03.04–10.04, 28.04–05.05.',go:'tour',gl:'Book the tour'},
 {id:'ny',k:['new year','christmas','holidays'],a:'New Year in the Maldives — signature tour from 30.12 to 06.01.27. We recommend booking early: group places are limited (8–12 people). Flights are not included in the tour price.',go:'tour',gl:'Book'},
 {id:'weather',k:['weather','climate','how is the weather','what is the weather','weather like','weather in'],a:'☀️ The Maldives are sunny all year round, and the temperature barely changes:\n• daytime — about +30…31 °C\n• evening and night — about +26…27 °C\n• water — +27…29 °C\n\nRain happens, but it is short — usually about an hour, then sunshine again.\n\nAsk about any month — e.g. “weather in March”.',go:'exc',gl:'Excursions'},
{id:'w_best',k:['best time','best season','when to go','when to visit','when should i go','when is the best','high season','low season','which month','what season'],a:'You can go any time of year — it’s always sunny and warm in the Maldives.\n• December–April — the driest and sunniest period, calm sea and great underwater visibility. High season: more tourists, book early.\n• May–November — also warm and sunny, with some short rains and a bit more wind, but fewer tourists.\n• New Year — peak demand, book as early as possible.\n\nAsk about any month — e.g. “weather in March”.',go:'exc',gl:'Excursions'},
{id:'w_rain',k:['rain','raining','rainy','showers','monsoon','thunderstorm','cloudy','umbrella'],a:'🌦 It does rain in the Maldives, but usually briefly — about an hour, warm, and then the sun is back. It doesn’t pour for whole days.\nThe fewest rains are December–April. May–November short showers are more frequent, but there is still lots of sun.\n⚠️ Don’t trust weather apps: they often show “rain” every day, while in reality it’s sunny with a short warm shower.',go:'exc',gl:'Excursions'},
{id:'w_app',k:['forecast','app shows rain','weather app','app says rain'],a:'Maldives forecasts almost always look scary — a rain icon nearly every day. In reality it’s usually a short warm shower of 40–60 minutes and sunshine the rest of the time, so don’t rely on the phone forecast.\nIf the sea is rough, the guide will tell you and may move the trip for your safety.',go:'exc',gl:'Excursions'},
{id:'w_water',k:['water temperature','water warm','warm water','is the water','sea temperature','cold water','wetsuit','can i swim'],a:'🌊 The water in the Maldives is warm all year — about +27…29 °C. Swimming is comfortable in any month, even in the evening.',go:'exc',gl:'Excursions'},
{id:'w_temp',k:['temperature','degrees','is it hot','hot there','how hot','is it cold','cold at night','chilly','jacket','sweater'],a:'🌡 The temperature in the Maldives is stable all year:\n• daytime — about +30…31 °C\n• evening and night — about +26…27 °C\nIt never gets cold: light clothes are fine even in the evening, no warm clothes needed.',go:'exc',gl:'Excursions'},
{id:'w_sea',k:['waves','wind','windy','rough sea','calm sea','storm','sea rough','is the sea','rough'],a:'The sea is calmest December–April. May–November there can be more wind and waves at times.\nSafety first: if the sea is rough, the guide may move the excursion to another day. ALWAYS listen to the guide.',go:'exc',gl:'Excursions'},
{id:'w_pack',k:['what to pack','what to bring','what should i bring','what clothes','what to wear in the maldives','should i pack','pack'],a:'What to bring to the Maldives:\n• light clothes, swimwear, sandals\n• sunscreen (SPF 50 is best), a hat, sunglasses\n• water for the excursion\nNo warm clothes needed — even evenings are about +26 °C.\nMasks, fins and life vests are provided on excursions.',go:'exc',gl:'Excursions'},
{id:'w_sun',k:['sunscreen','spf','strong sun','sun protection','get a tan','tan'],a:'☀️ The sun in the Maldives is very strong — you can burn even when it’s cloudy.\n• SPF 50 sunscreen, reapply after swimming\n• a hat and sunglasses\n• drink water\nNote: sunburn is not a reason for a refund or rescheduling.',go:'exc',gl:'Excursions'},
