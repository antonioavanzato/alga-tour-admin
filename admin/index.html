:root{
  --teal:#0e5f76; --teal-deep:#0a4150; --teal-ink:#103943;
  --aqua:#2bbdee; --aqua-soft:#8bdcf7; --aqua-pale:#d7f1fb;
  --sand:#f4efe6; --sand-2:#ebe3d4; --muted:#5d7b83; --line:#e4ddce;
  --bg:var(--sand); --card:#fff; --ink:var(--teal-ink); --faint:#8fa5ab; --subtle:#faf7f1;
  --field:#fff; --err:#c2453d; --err-line:#efc9c3; --err-bg:#fdeeec;
  --notes-bg:#fbf6ea; --notes-line:#ecdcb8; --notes-ink:#6b5526;
  --shadow:0 1px 2px rgba(14,95,118,.05),0 14px 32px -18px rgba(14,95,118,.28);
  --shadow-h:0 2px 6px rgba(14,95,118,.07),0 22px 44px -20px rgba(14,95,118,.38);
  --overlay:rgba(10,65,80,.42);
  --head:"AlgaJost","AlgaManrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --body:"AlgaManrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1a1f; --card:#16262d; --ink:#eaf6fa; --muted:#9fb6bd; --faint:#6f8a92; --subtle:#122128;
  --line:#253a42; --field:#122128; --sand-2:#22363e; --aqua-pale:rgba(43,189,238,.14);
  --err:#ef7a70; --err-line:#5a2c2a; --err-bg:#2a1818;
  --notes-bg:#221f17; --notes-line:#4a3f26; --notes-ink:#e6d3a6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 32px -18px rgba(0,0,0,.6);
  --shadow-h:0 2px 6px rgba(0,0,0,.35),0 22px 44px -20px rgba(0,0,0,.7);
  --overlay:rgba(3,12,16,.6);
  color-scheme:dark;
}}
html,body{margin:0;padding:0;background:var(--bg);-webkit-text-size-adjust:100%;}
body{min-height:100vh;}

.alga-admin{
  --mono:var(--body);
  font-family:var(--body); color:var(--ink); max-width:1080px; margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 1.1rem) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 3rem) max(16px,env(safe-area-inset-left));
  box-sizing:border-box; -webkit-font-smoothing:antialiased; line-height:1.45;
}
.alga-admin *,.alga-admin *::before,.alga-admin *::after{box-sizing:border-box;}
.alga-admin .hidden{display:none !important;}
@keyframes alga-up{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
@keyframes alga-shine{0%,60%{transform:translateX(-120%);}100%{transform:translateX(120%);}}

/* ── вход ── */
.alga-admin #loginScreen{min-height:calc(100vh - 6rem); display:flex; align-items:center; justify-content:center;}
.alga-admin .login-card{width:100%; max-width:400px; margin:1.5rem auto; background:var(--card);
  border:1px solid var(--line); border-radius:32px; overflow:hidden; box-shadow:var(--shadow-h);
  animation:alga-up .6s var(--ease) both;}
.alga-admin .login-accent{height:6px; background:linear-gradient(90deg,var(--aqua),var(--teal));}
.alga-admin .login-body{padding:36px 30px 30px;}
.alga-admin .login-brand{display:flex; align-items:center; gap:12px; margin-bottom:30px;}
.alga-admin .login-mark{width:46px; height:46px; border-radius:15px; background:linear-gradient(135deg,var(--aqua),var(--teal));
  display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 10px 22px -10px rgba(14,95,118,.7);}
.alga-admin .login-brand .nm{font-family:var(--head); font-size:21px; font-weight:600; letter-spacing:.06em; line-height:1;}
.alga-admin .login-brand .sub{display:flex; align-items:center; gap:8px; font-size:10.5px; font-weight:700; letter-spacing:.2em;
  text-transform:uppercase; color:var(--teal); margin-top:6px;}
.alga-admin .login-brand .sub::before{content:""; width:18px; height:1.5px; background:var(--aqua);}
.alga-admin .login-card h2{font-family:var(--head); font-size:28px; font-weight:600; letter-spacing:-.01em; margin:0 0 6px; line-height:1.1;}
.alga-admin .login-card p{font-size:14px; color:var(--muted); margin:0 0 26px;}
.alga-admin label{display:block; font-size:10.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:8px;}
.alga-admin .field{display:flex; align-items:center; gap:10px; border:1.5px solid var(--line);
  border-radius:16px; padding:0 16px; height:54px; background:var(--field); margin-bottom:16px;
  transition:border-color .2s, box-shadow .2s;}
.alga-admin .field:focus-within{border-color:var(--aqua); box-shadow:0 0 0 4px rgba(43,189,238,.16);}
.alga-admin .field svg{flex-shrink:0;}
.alga-admin .field svg *{stroke:var(--faint);}
.alga-admin .field input{flex:1; min-width:0; height:100%; border:none; outline:none; background:transparent;
  font-family:inherit; font-size:16px; color:var(--ink); -webkit-appearance:none; appearance:none;}
.alga-admin .field input::placeholder{color:var(--faint); opacity:1;}
.alga-admin .field input:-webkit-autofill{-webkit-box-shadow:0 0 0 40px var(--field) inset; -webkit-text-fill-color:var(--ink);}
.alga-admin .btn{position:relative; overflow:hidden; width:100%; height:56px; border:none; border-radius:999px;
  background:linear-gradient(135deg,var(--aqua),var(--teal)); color:#fff; font-family:inherit; font-size:16px; font-weight:700;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; margin-top:6px;
  box-shadow:0 16px 30px -16px rgba(14,95,118,.8); transition:transform .25s var(--ease), box-shadow .25s;}
.alga-admin .btn::after{content:""; position:absolute; inset:0; background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
  transform:translateX(-120%); animation:alga-shine 3.6s ease-in-out 1.5s infinite; pointer-events:none;}
.alga-admin .btn svg{transition:transform .3s;}
.alga-admin .btn:disabled{opacity:.6; cursor:not-allowed;}
.alga-admin .login-err{color:var(--err); font-size:13px; text-align:center; margin-top:14px; min-height:1.1rem;}
.alga-admin .login-foot{font-size:11.5px; color:var(--faint); text-align:center; margin-top:16px;}

/* ── шапка ── */

<script type="module">
const API_URL = 'https://functions.yandexcloud.net/d4ed9gsamgdaflofq6jj';
let authToken = localStorage.getItem('alga_token') || null;
let authEmail = localStorage.getItem('alga_email') || null;

async function api(action, { method = 'GET', body } = {}) {
  const r = await fetch(`${API_URL}?action=${action}`, {
    method,
    headers: { 'Content-Type': 'application/json', ...(authToken ? { 'X-Alga-Token': authToken } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401 && action !== 'login') { setAuth(null, null); showLogin(); throw new Error('unauthorized'); }
  if (!r.ok) throw new Error('api ' + r.status);
  return r.json();
}
function setAuth(token, email) {
  authToken = token; authEmail = email;
  if (token) { localStorage.setItem('alga_token', token); localStorage.setItem('alga_email', email); }
  else { localStorage.removeItem('alga_token'); localStorage.removeItem('alga_email'); }
}

const $ = (id) => document.getElementById(id);
const loginScreen = $('loginScreen'), panel = $('panel');
let allBookings = [], byId = {}, pollTimer = null, knownIds = null, audioCtx = null;

const overlay = $('modalOverlay'), modalBox = $('modalBox'), ptr = $('ptr');
document.body.appendChild(overlay);
document.body.appendChild(ptr);

const TYPE_LABEL = { excursion:'Экскурсия', resort:'Резорт', hotel:'Отель', author:'Авторский тур', diving:'Дайвинг', sport:'Активный спорт' };
const STATUS = {
  new:      { label:'Новая',        cls:'st-new',      dot:'#e0a03a' },
  progress: { label:'В работе',     cls:'st-progress', dot:'#2bbdee' },
  done:     { label:'Подтверждена', cls:'st-done',     dot:'#2bb673' },
  cancel:   { label:'Отменена',     cls:'st-cancel',   dot:'#c2453d' }
};

async function enablePush() {
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !authToken) return;
    const reg = await navigator.serviceWorker.register('sw.js');
    const { key } = await api('vapid');
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
    await api('subscribe', { method: 'POST', body: { subscription: sub.toJSON() } });
  } catch (e) { console.error('push:', e); }
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'alga-push') { beep(); refreshData(); }
  });
}

$('bellBtn').addEventListener('click', async () => {
  if ('Notification' in window) {
    const p = await Notification.requestPermission();
    if (p === 'granted') { $('bellBtn').classList.add('on'); enablePush(); }
    else { alert('Уведомления заблокированы. Разрешите их в настройках устройства.'); }
  } else { alert('Это устройство не поддерживает системные уведомления. Звук работает.'); }
});

function beep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    [0, 0.18].forEach((d, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = i === 0 ? 880 : 1175;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.35, t + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.16);
      o.start(t + d); o.stop(t + d + 0.18);
    });
  } catch (e) {}
}

function notifyNew(b) {
  beep();
  if ('Notification' in window && Notification.permission === 'granted') {
    const txt = (b.fio || 'Без имени') + ' · ' + (TYPE_LABEL[b.service_type] || '') + ' · ' + (b.phone || '');
    try { new Notification('🔔 Новая заявка ALGA', { body: txt, tag: 'alga-booking' }); } catch (e) {}
  }
}

$('loginBtn').addEventListener('click', doLogin);
$('adminPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
async function doLogin() {
  try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch(e){}
  $('loginErr').textContent = '';
  $('loginBtn').disabled = true;
  try {
    const res = await api('login', { method: 'POST', body: { email: $('adminEmail').value.trim(), password: $('adminPass').value } });
    setAuth(res.token, res.email);
    showPanel();
  } catch (e) {
    $('loginErr').textContent = 'Неверный email или пароль';
  } finally {
    $('loginBtn').disabled = false;
  }
}
$('logoutBtn').addEventListener('click', () => {
  setAuth(null, null);
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  showLogin();
});

function showPanel() {
  loginScreen.classList.add('hidden'); panel.classList.remove('hidden');
  $('userEmail').textContent = authEmail || '';
  if ('Notification' in window && Notification.permission === 'granted') { $('bellBtn').classList.add('on'); enablePush(); }
  knownIds = null; startPolling();
}
function showLogin() {
  panel.classList.add('hidden'); loginScreen.classList.remove('hidden'); $('adminPass').value = '';
}

function setDbDot(ok) { const d = $('dbDot'); if (d) d.classList.toggle('on', ok); }

async function loadBookings() {
  let res;
  try { res = await api('bookings'); }
  catch (e) { setDbDot(false); throw e; }
  setDbDot(true);
  const bookings = res.bookings || [];
  if (knownIds) bookings.forEach((b) => { if (!knownIds.has(b.id)) notifyNew(b); });
  knownIds = new Set(bookings.map((b) => b.id));
  allBookings = bookings; byId = {}; allBookings.forEach((b) => byId[b.id] = b);
  render();
}
function startPolling() {
  loadBookings().catch((e) => {
    if (e.message !== 'unauthorized') $('list').innerHTML = '<div class="empty">Не удалось загрузить заявки. Проверьте интернет и обновите страницу.</div>';
  });
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (!document.hidden && authToken) loadBookings().catch(console.error); }, 30000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && authToken) loadBookings().catch(console.error); });

if (authToken) showPanel(); else showLogin();

['searchInput','typeFilter','statusFilter'].forEach((id) => $(id).addEventListener('input', render));

(function () {
  const inp = $('searchInput'), clr = $('searchClear');
  const sync = () => clr.classList.toggle('show', inp.value.length > 0);
  inp.addEventListener('input', sync);
  clr.addEventListener('click', () => { inp.value = ''; sync(); render(); inp.focus(); });
  sync();
})();

function render() {
  const count = (f) => allBookings.filter(f).length;
  $('stats').innerHTML = [
    ['Всего', allBookings.length, '#0e5f76'],
    ['Новые', count(b => (b.status||'new') === 'new'), '#e0a03a'],
    ['В работе', count(b => b.status === 'progress'), '#2bbdee'],
    ['Готово', count(b => b.status === 'done'), '#2bb673']
  ].map(([l,n,c]) => `<div class="stat"><div class="stat-top"><span class="stat-label">${l}</span><span class="stat-dot" style="background:${c}"></span></div><div class="stat-n">${n}</div></div>`).join('');

  const term = $('searchInput').value.trim().toLowerCase();
  const tf = $('typeFilter').value, sf = $('statusFilter').value;
  const rows = allBookings.filter((b) => {
    const st = b.status || 'new';
    if (tf && b.service_type !== tf) return false;
    if (sf && st !== sf) return false;
    if (term) { const hay = ((b.fio||'') + ' ' + (b.phone||'')).toLowerCase(); if (!hay.includes(term)) return false; }
    return true;
  });

  $('empty').classList.toggle('hidden', rows.length > 0);
  $('list').innerHTML = rows.map(card).join('');

  document.querySelectorAll('.alga-admin .card').forEach((el) => {
    el.addEventListener('click', (e) => { if (e.target.closest('.status-sel')) return; openModal(el.dataset.id); });
  });
  document.querySelectorAll('.alga-admin .status-sel').forEach((sel) => {
    sel.addEventListener('click', (e) => e.stopPropagation());
    sel.addEventListener('change', async function () {
      const id = this.dataset.id, old = this.dataset.cur;
      this.className = 'status-sel ' + STATUS[this.value].cls;
      this.dataset.cur = this.value;
      const rail = this.closest('.card').querySelector('.card-rail');
      if (rail) rail.style.background = STATUS[this.value].dot;
      try { await api('status', { method: 'POST', body: { id, status: this.value } }); }
      catch (e) { alert('Не удалось сохранить статус'); this.value = old; this.dataset.cur = old; }
    });
  });
}

function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function card(b) {
  const st = b.status || 'new';
  const t = b.service_type || 'excursion';
  const opts = Object.keys(STATUS).map(k => `<option value="${k}" ${k===st?'selected':''}>${STATUS[k].label}</option>`).join('');
  const subParts = [];
  if (b.service) subParts.push(esc(b.service)); else subParts.push(TYPE_LABEL[t] || t);
  if (b.people) subParts.push(esc(b.people) + ' чел');
  return `<div class="card" data-id="${b.id}">
    <div class="card-rail" style="background:${STATUS[st].dot}"></div>
    <div class="card-main">
      <div class="card-meta"><span class="chip">${TYPE_LABEL[t]||t}</span><span class="card-time">${esc(b.received) || '—'}</span></div>
      <div class="card-name">${esc(b.fio) || '—'}</div>
      <div class="card-sub">${subParts.join(' · ')}</div>
      <div class="card-phone">${esc(b.phone) || '—'}</div>
    </div>
    <div class="card-right">
      <select class="status-sel ${STATUS[st].cls}" data-id="${b.id}" data-cur="${st}">${opts}</select>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>`;
}

overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
let modalClosedAt = 0;
function closeModal(){ overlay.classList.remove('show'); modalClosedAt = Date.now(); }
window.closeAlgaModal = closeModal;

let dragStartY = null, dragging = false;
modalBox.addEventListener('touchstart', (e) => {
  if (modalBox.scrollTop > 0) return;
  dragStartY = e.touches[0].clientY; dragging = true; modalBox.style.transition = 'none';
}, { passive: true });
modalBox.addEventListener('touchmove', (e) => {
  if (!dragging || dragStartY === null) return;
  const dy = e.touches[0].clientY - dragStartY;
  if (dy > 0) { modalBox.style.transform = 'translateY(' + dy + 'px)'; overlay.style.background = 'rgba(16,36,43,' + Math.max(0, 0.5 * (1 - dy / 250)) + ')'; }
}, { passive: true });
modalBox.addEventListener('touchend', (e) => {
  if (!dragging) return;
  dragging = false;
  const dy = e.changedTouches[0].clientY - dragStartY;
  modalBox.style.transition = ''; overlay.style.background = '';
  if (dy > 120) { closeModal(); setTimeout(() => { modalBox.style.transform = ''; }, 300); }
  else { modalBox.style.transform = ''; }
  dragStartY = null;
}, { passive: true });

function openModal(id) {
  const b = byId[id]; if (!b) return;
  const t = b.service_type || 'excursion';
  const digits = (b.phone || '').replace(/\D/g, '');
  const rows = [];
  const add = (k, v, mono) => { if (v) rows.push(`<div class="m-row"><span class="k">${k}</span><span class="v${mono?' mono':''}">${esc(v)}</span></div>`); };
  const fmtD = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? m[3] + '.' + m[2] + '.' + m[1] : (s || ''); };

  add('Телефон', b.phone, true);
  add('Услуга', b.service);
  if (t === 'hotel') { add('Дата заезда', fmtD(b.date1), true); add('Дата выезда', fmtD(b.date2), true); add('Номеров', b.people, true); add('Гостей', b.guests, true); }
  else if (t === 'author') { add('Начало', fmtD(b.date1), true); add('Окончание', fmtD(b.date2), true); add('Человек', b.people, true); }
  else { add('Дата', fmtD(b.date1), true); add('Человек', b.people, true); }
  add('Остров выезда', b.island);
  add('Приватный трансфер', b.transfer);
  add('Получено', b.received, true);

  const waIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 018.413 3.488 11.824 11.824 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 001.51 5.26l-.999 3.648 3.978-1.607zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>';
  const tgIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M11.944 0A12 12 0 000 12a12 12 0 0012 12 12 12 0 0012-12A12 12 0 0012 0a12 12 0 00-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 01.171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>';
  const callIcon = '<svg width="17" height="17" viewBox="0 0 24 24" fill="#fff"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>';
  const copyIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="2" stroke="#3a4d54" stroke-width="1.8"/><path d="M5 15V5a2 2 0 0 1 2-2h10" stroke="#3a4d54" stroke-width="1.8"/></svg>';
  const delIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" stroke="#c2453d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  modalBox.innerHTML = `
    <div class="m-grab"></div>
    <div class="m-head">
      <div><span class="m-badge">${TYPE_LABEL[t]||t}</span><h3 class="m-name">${esc(b.fio) || '—'}</h3></div>
      <button class="m-close" onclick="window.closeAlgaModal()">&times;</button>
    </div>
    <div class="m-rows">${rows.join('')}</div>
    ${b.notes ? `<div class="m-notes">📝 ${esc(b.notes)}</div>` : ''}
    <div class="m-actions">
      <a class="m-btn b-wa" href="whatsapp://send?phone=${digits}">${waIcon} WhatsApp</a>
      <a class="m-btn b-tg" href="tg://resolve?phone=${digits}">${tgIcon} Telegram</a>
      <a class="m-btn b-call" href="tel:+${digits}">${callIcon} Позвонить</a>
      <button class="m-btn b-copy" id="copyPhone">${copyIcon} Копировать</button>
      <button class="m-btn b-del" id="delBtn">${delIcon} Удалить заявку</button>
    </div>`;

  overlay.classList.add('show');

  const copyBtn = $('copyPhone');
  if (copyBtn) copyBtn.addEventListener('click', () => { navigator.clipboard?.writeText(b.phone || '').then(() => { copyBtn.innerHTML = '✓ Скопировано'; }); });

  const delBtn = $('delBtn');
  if (delBtn) delBtn.addEventListener('click', async () => {
    if (!confirm('Удалить заявку «' + (b.fio || '') + '» безвозвратно?')) return;
    delBtn.disabled = true; delBtn.textContent = 'Удаление...';
    try { await api('delete', { method: 'POST', body: { id } }); closeModal(); refreshData(); }
    catch (e) { alert('Не удалось удалить заявку.'); delBtn.disabled = false; delBtn.innerHTML = delIcon + ' Удалить заявку'; }
  });
}

function refreshData() { if (authToken) loadBookings().catch(console.error); }
(function () {
  let ptrStart = null, ptrPulling = false;
  const PTR_MAX = 90, PTR_TRIG = 65;
  window.addEventListener('touchstart', (e) => {
    if (panel.classList.contains('hidden')) return;
    if (overlay.classList.contains('show')) return;
    if (Date.now() - modalClosedAt < 600) return; // жест закрытия модалки не должен дёргать pull-to-refresh
    if (window.scrollY > 0) return;
    ptrStart = e.touches[0].clientY; ptrPulling = true;
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (!ptrPulling || ptrStart === null) return;
    const dy = e.touches[0].clientY - ptrStart;
    if (dy > 0 && window.scrollY <= 0) { const d = Math.min(dy, PTR_MAX); ptr.style.transform = `translateX(-50%) translateY(${d - 42}px) rotate(${d * 4}deg)`; }
  }, { passive: true });
  window.addEventListener('touchend', (e) => {
    if (!ptrPulling) return;
    ptrPulling = false;
    const dy = e.changedTouches[0].clientY - ptrStart;
    ptrStart = null;
    if (dy > PTR_TRIG) { ptr.classList.add('spin'); ptr.style.transform = 'translateX(-50%) translateY(15px)'; refreshData(); setTimeout(() => { ptr.classList.remove('spin'); ptr.style.transform = ''; }, 800); }
    else { ptr.style.transform = ''; }
  }, { passive: true });
})();
</script>
</body>
</html>
